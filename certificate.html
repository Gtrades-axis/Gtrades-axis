<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate | GTRADES-AXIS™</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <link rel="stylesheet" href="css/academy.css" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .cert-container {
      max-width: 800px;
      margin: 0 auto;
      background: linear-gradient(145deg, #121927, #070b12);
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .cert-container .logo {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--blue), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .cert-container .subtitle {
      color: var(--text2);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .cert-container .cert-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      margin: 16px 0;
    }
    .cert-container .name {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      margin: 8px 0;
    }
    .cert-container .desc {
      color: var(--text2);
      font-size: 1rem;
      margin: 8px 0;
    }
    .cert-container .module-name {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
      margin: 12px 0;
    }
    .cert-container .date {
      color: #64748b;
      font-size: 0.85rem;
      margin-top: 12px;
    }
    .cert-container .footer {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cert-container .footer .cert-id {
      font-family: monospace;
      color: var(--text2);
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .btn-gold {
      background: linear-gradient(135deg, #ffb300, #f57c00);
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-gold:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div class="academy-app">

  <aside class="academy-sidebar">
    <div class="logo">
      <img src="images/logo.png" alt="GTRADES-AXIS" />
      <h2>GTRADES <span>AXIS™</span></h2>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="academy.html"><i class="fa-solid fa-graduation-cap"></i> Academy</a>
      <a href="resources.html"><i class="fa-solid fa-folder-open"></i> Resources</a>
      <a href="journal.html"><i class="fa-solid fa-book"></i> Journal</a>
      <a href="analytics.html"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
      <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
    </nav>
    <button id="logoutBtn" class="logout-btn">
      <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>
  </aside>

  <main class="academy-main">
    <div id="certContainer" class="cert-container">
      <div class="logo">GTRADES‑AXIS™</div>
      <div class="subtitle">Premium Academy</div>
      <div class="cert-title">🏆 Certificate of Completion</div>
      <div class="desc">This certifies that</div>
      <div class="name" id="userName">Loading...</div>
      <div class="desc">has successfully completed</div>
      <div class="module-name" id="moduleTitle">—</div>
      <div class="date" id="issueDate"></div>
      <div class="footer">
        <span>Issued by GTRADES-AXIS™ Academy</span>
        <span class="cert-id" id="certId">#GTRADES-001</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="downloadPngBtn"><i class="fa-solid fa-image"></i> Download PNG</button>
      <button class="btn-gold" id="downloadPdfBtn"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
      <a href="academy.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back</a>
    </div>
  </main>
</div>

<button id="scrollTopBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/certificate.js"></script>

<script>
  (function() {
    const btn = document.getElementById('scrollTopBtn');
    if (!btn) return;
    window.addEventListener('scroll', function() {
      btn.classList.toggle('visible', window.scrollY > 250);
    });
    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();
</script>

</body>
</html>
