<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTRADES-AXIS™ – Trade History</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/journal.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- ======================================================
        SIDEBAR
        ====================================================== -->

        <aside class="sidebar">

            <div class="logo">
                <img src="images/imageslogo.png.png" alt="GTRADES-AXIS Logo" draggable="false">
                <h2>GTRADES <span>AXIS™</span></h2>
            </div>

            <nav>
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="premium-academy.html"><i class="fa-solid fa-graduation-cap"></i> Academy</a>
                <a href="downloads.html"><i class="fa-solid fa-folder-open"></i> Resources</a>
                <a href="journal.html"><i class="fa-solid fa-chart-line"></i> Trading Journal</a>
                <a href="analytics.html"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
                <a class="active" href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
                <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
                <a href="support.html"><i class="fa-solid fa-headset"></i> Support</a>
            </nav>

            <button id="logoutBtn" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>

        </aside>

        <!-- ======================================================
        MAIN CONTENT
        ====================================================== -->

        <main class="main-content">

            <div class="page-header">
                <div>
                    <h1>📜 Trade History</h1>
                    <p>View, edit, and manage all your past trades.</p>
                </div>
                <div class="header-actions">
                    <a href="journal.html" class="btn"><i class="fa-solid fa-plus"></i> New Trade</a>
                    <a href="analytics.html" class="btn"><i class="fa-solid fa-chart-column"></i> Analytics</a>
                </div>
            </div>

            <!-- ======================================================
            HISTORY TABLE
            ====================================================== -->

            <div class="history-table-wrap">

                <div id="loadingIndicator" class="loading" style="display:none;">
                    <i class="fa-solid fa-spinner fa-spin"></i> Loading trades...
                </div>

                <div id="noTradesMsg" class="no-trades" style="display:none;">
                    <i class="fa-solid fa-inbox"></i>
                    No trades recorded yet.<br>
                    <a href="journal.html" style="color:#3b82f6; text-decoration:none; font-weight:600;">
                        <i class="fa-solid fa-plus"></i> Start your first trade
                    </a>
                </div>

                <table style="display:none;" id="historyTableWrap">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Pair</th>
                            <th>Direction</th>
                            <th>Status</th>
                            <th>Result</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                    </tbody>
                </table>

            </div>

        </main>

    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
            }
        }
    </script>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/history.js"></script>

</body>

</html>
