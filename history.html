<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTRADES-AXIS™ Trading History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <style>
        /* ... (keep your existing styles, same as before) ... */
        /* I'm omitting the full CSS for brevity – use the one from earlier */
    </style>
</head>
<body>

    <!-- ===== SIDEBAR (same as before) ===== -->
    <div class="dashboard-container">
        <aside class="sidebar">
            <!-- ... same sidebar ... -->
        </aside>

        <main class="main-content">
            <!-- ===== HEADER ===== -->
            <div class="page-header">
                <div>
                    <h1><i class="fa-solid fa-clock-rotate-left"></i> Trading History</h1>
                    <p>Review every trade you've recorded.</p>
                </div>
                <div class="header-actions">
                    <a href="journal.html" class="btn"><i class="fa-solid fa-pen-to-square"></i> New Trade</a>
                    <a href="analytics.html" class="btn"><i class="fa-solid fa-chart-column"></i> Analytics</a>
                </div>
            </div>

            <!-- ===== STATS ===== -->
            <section class="stats-grid">
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-list"></i></div><h3>Total Trades</h3><h1 id="statTotal">0</h1></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-percent"></i></div><h3>Win Rate</h3><h1 id="statWinRate" class="value-positive">0%</h1></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-arrow-right-arrow-left"></i></div><h3>Avg RR</h3><h1 id="statAvgRR">0.0</h1></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-wallet"></i></div><h3>Net Profit</h3><h1 id="statNetProfit" class="value-positive">$0</h1></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-check-circle"></i></div><h3>Wins</h3><h1 id="statWins" class="value-positive">0</h1></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-times-circle"></i></div><h3>Losses</h3><h1 id="statLosses" class="value-negative">0</h1></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-fire"></i></div><h3>Best Streak</h3><h1 id="statStreak">0</h1></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-calendar-day"></i></div><h3>This Month</h3><h1 id="statMonth">0</h1></div>
            </section>

            <!-- ===== FILTERS ===== -->
            <div class="filter-bar">
                <div class="filter-group"><label for="filterPair">Pair</label><input type="text" id="filterPair" placeholder="EURUSD"></div>
                <div class="filter-group"><label for="filterDirection">Direction</label><select id="filterDirection"><option value="">All</option><option>BUY</option><option>SELL</option></select></div>
                <div class="filter-group"><label for="filterResult">Result</label><select id="filterResult"><option value="">All</option><option>Win</option><option>Loss</option><option>Breakeven</option></select></div>
                <div class="filter-group"><label for="filterDateFrom">From</label><input type="date" id="filterDateFrom"></div>
                <div class="filter-group"><label for="filterDateTo">To</label><input type="date" id="filterDateTo"></div>
                <div class="filter-actions">
                    <button class="btn-filter" id="applyFilters"><i class="fa-solid fa-filter"></i> Apply</button>
                    <button class="btn-filter reset" id="resetFilters"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                </div>
            </div>

            <!-- ===== TABLE ===== -->
            <div class="table-wrapper">
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th data-sort="date">Date <i class="fa-solid fa-sort"></i></th>
                                <th data-sort="pair">Pair <i class="fa-solid fa-sort"></i></th>
                                <th data-sort="direction">Dir <i class="fa-solid fa-sort"></i></th>
                                <th data-sort="entry">Entry <i class="fa-solid fa-sort"></i></th>
                                <th data-sort="stopLoss">SL <i class="fa-solid fa-sort"></i></th>
                                <th data-sort="takeProfit">TP <i class="fa-solid fa-sort"></i></th>
                                <th data-sort="rr">RR <i class="fa-solid fa-sort"></i></th>
                                <th data-sort="profit">P/L <i class="fa-solid fa-sort"></i></th>
                                <th data-sort="result">Result <i class="fa-solid fa-sort"></i></th>
                                <th>Chart Links</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tradeTableBody"></tbody>
                    </table>
                </div>
                <div class="table-actions">
                    <div class="info">Showing <strong id="showingCount">0</strong> of <strong id="totalCount">0</strong> trades</div>
                    <div class="actions">
                        <button id="exportCSV"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                        <button id="exportJSON"><i class="fa-solid fa-file-code"></i> Export JSON</button>
                        <button id="clearAll" class="danger"><i class="fa-solid fa-trash-can"></i> Clear All</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- ===== VIEW MODAL ===== -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <h2><i class="fa-solid fa-eye"></i> Trade Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // HISTORY JAVASCRIPT
        // ============================================================

        const STORAGE_KEY = "trades";
        let trades = [];
        let filteredTrades = [];
        let sortKey = 'date';
        let sortAsc = false;

        // DOM refs
        const tbody = document.getElementById('tradeTableBody');
        const showingCount = document.getElementById('showingCount');
        const totalCount = document.getElementById('totalCount');
        const statTotal = document.getElementById('statTotal');
        const statWinRate = document.getElementById('statWinRate');
        const statAvgRR = document.getElementById('statAvgRR');
        const statNetProfit = document.getElementById('statNetProfit');
        const statWins = document.getElementById('statWins');
        const statLosses = document.getElementById('statLosses');
        const statStreak = document.getElementById('statStreak');
        const statMonth = document.getElementById('statMonth');

        const filterPair = document.getElementById('filterPair');
        const filterDirection = document.getElementById('filterDirection');
        const filterResult = document.getElementById('filterResult');
        const filterDateFrom = document.getElementById('filterDateFrom');
        const filterDateTo = document.getElementById('filterDateTo');
        const applyBtn = document.getElementById('applyFilters');
        const resetBtn = document.getElementById('resetFilters');
        const exportCSVBtn = document.getElementById('exportCSV');
        const exportJSONBtn = document.getElementById('exportJSON');
        const clearAllBtn = document.getElementById('clearAll');

        // Modal
        const modal = document.getElementById('viewModal');
        const modalBody = document.getElementById('modalBody');
        const closeModal = document.getElementById('closeModal');

        // ─── LOAD ────────────────────────────────────────────────────
        function loadTrades() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                trades = raw ? JSON.parse(raw) : [];
                trades = trades.filter(t => t && typeof t === 'object').map(t => {
                    if (!t.id) t.id = Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                    return t;
                });
            } catch (e) { trades = []; }
            trades.sort((a, b) => new Date(b.date) - new Date(a.date));
            filteredTrades = [...trades];
        }

        function saveTrades() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(trades));
        }

        // ─── RENDER ──────────────────────────────────────────────────
        function renderTable() {
            const data = filteredTrades;
            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="11">
                        <div class="empty-state">
                            <i class="fa-solid fa-inbox"></i>
                            <h3>No trades found</h3>
                            <p>Start journaling your trades in the <a href="journal.html" style="color:var(--accent-blue);text-decoration:none;">Trading Journal</a>.</p>
                        </div>
                    </td></tr>
                `;
                showingCount.textContent = '0';
                totalCount.textContent = trades.length;
                updateStats();
                return;
            }

            const sorted = [...data];
            sorted.sort((a, b) => {
                let valA = a[sortKey] ?? '';
                let valB = b[sortKey] ?? '';
                if (['profit','rr','entry','stopLoss','takeProfit'].includes(sortKey)) {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                }
                if (sortKey === 'date') {
                    valA = new Date(valA).getTime() || 0;
                    valB = new Date(valB).getTime() || 0;
                }
                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();
                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });

            let html = '';
            for (const t of sorted) {
                const profit = parseFloat(t.profit) || 0;
                const profitClass = profit > 0 ? 'positive' : profit < 0 ? 'negative' : 'zero';
                const profitDisplay = profit > 0 ? `+$${profit.toFixed(2)}` : profit < 0 ? `-$${Math.abs(profit).toFixed(2)}` : '$0.00';
                const resultClass = t.result?.toLowerCase() === 'win' ? 'win' : t.result?.toLowerCase() === 'loss' ? 'loss' : 'breakeven';
                const directionClass = t.direction?.toLowerCase() === 'buy' ? 'buy' : 'sell';

                // Chart links
                let chartLinksHtml = '';
                const links = [
                    { label: 'Before', url: t.beforeChart },
                    { label: 'During', url: t.duringChart },
                    { label: 'After', url: t.afterChart }
                ];
                const hasLink = links.some(l => l.url && l.url.trim() !== '');
                if (hasLink) {
                    chartLinksHtml = links.map(l => {
                        if (l.url && l.url.trim() !== '') {
                            return `<a href="${l.url}" target="_blank" title="${l.label}"><i class="fa-solid fa-image"></i>${l.label}</a>`;
                        }
                        return '';
                    }).filter(l => l).join(' ');
                } else {
                    chartLinksHtml = `<span class="no-link">—</span>`;
                }

                html += `
                    <tr>
                        <td>${formatDate(t.date)}</td>
                        <td><strong>${t.pair || '—'}</strong></td>
                        <td><span class="badge-direction ${directionClass}">${t.direction || '—'}</span></td>
                        <td>${t.entry ?? '—'}</td>
                        <td>${t.stopLoss ?? '—'}</td>
                        <td>${t.takeProfit ?? '—'}</td>
                        <td>${t.rr ? t.rr.toFixed(1) : '—'}</td>
                        <td class="trade-profit ${profitClass}">${profitDisplay}</td>
                        <td><span class="badge-result ${resultClass}">${t.result || '—'}</span></td>
                        <td><div class="chart-links">${chartLinksHtml}</div></td>
                        <td>
                            <div class="action-buttons">
                                <button class="view-btn" data-id="${t.id}" title="View"><i class="fa-regular fa-eye"></i></button>
                                <button class="edit-btn" data-id="${t.id}" title="Edit"><i class="fa-regular fa-pen-to-square"></i></button>
                                <button class="delete-btn" data-id="${t.id}" title="Delete"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            }

            tbody.innerHTML = html;
            showingCount.textContent = sorted.length;
            totalCount.textContent = trades.length;

            // ── EVENT LISTENERS ──
            // View
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const trade = trades.find(t => t.id === id);
                    if (trade) openViewModal(trade);
                });
            });

            // Edit – FIXED: ensures proper navigation
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    console.log('✏️ Edit clicked for ID:', id);
                    window.location.href = `journal.html?edit=${id}`;
                });
            });

            // Delete
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    if (confirm('Delete this trade?')) deleteTrade(id);
                });
            });

            updateStats();

            // Sort indicators
            document.querySelectorAll('thead th').forEach(th => {
                th.classList.remove('sorted');
                const key = th.dataset.sort;
                if (key === sortKey) {
                    th.classList.add('sorted');
                    const icon = th.querySelector('i');
                    if (icon) icon.className = sortAsc ? 'fa-solid fa-sort-up' : 'fa-solid fa-sort-down';
                } else {
                    const icon = th.querySelector('i');
                    if (icon) icon.className = 'fa-solid fa-sort';
                }
            });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            try { const d = new Date(dateStr); if (isNaN(d)) return dateStr; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch { return dateStr; }
        }

        // ─── STATS ──────────────────────────────────────────────────
        function updateStats() {
            const data = filteredTrades;
            const total = data.length;
            let wins = 0, losses = 0, totalProfit = 0, totalRR = 0, rrCount = 0;
            let bestStreak = 0, currentStreak = 0, streakType = null;
            const now = new Date();
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            let monthCount = 0;

            for (const t of data) {
                const profit = parseFloat(t.profit) || 0;
                totalProfit += profit;
                const rr = parseFloat(t.rr) || 0;
                if (rr > 0) { totalRR += rr; rrCount++; }
                const result = t.result?.toLowerCase() || '';
                if (result === 'win') wins++;
                else if (result === 'loss') losses++;

                if (result === 'win') {
                    if (streakType === 'win') currentStreak++;
                    else { streakType = 'win'; currentStreak = 1; }
                } else if (result === 'loss') {
                    if (streakType === 'loss') currentStreak++;
                    else { streakType = 'loss'; currentStreak = 1; }
                } else { streakType = null; currentStreak = 0; }
                if (currentStreak > bestStreak) bestStreak = currentStreak;

                if (t.date) {
                    try { const d = new Date(t.date); if (d >= monthStart) monthCount++; } catch {}
                }
            }
            if (total === 0) bestStreak = 0;
            const winRate = total > 0 ? (wins / total) * 100 : 0;
            const avgRR = rrCount > 0 ? totalRR / rrCount : 0;

            statTotal.textContent = total;
            statWinRate.textContent = winRate.toFixed(1) + '%';
            statWinRate.className = winRate >= 50 ? 'value-positive' : winRate > 0 ? 'value-neutral' : 'value-negative';
            statAvgRR.textContent = avgRR.toFixed(1);
            statNetProfit.textContent = (totalProfit >= 0 ? '+' : '') + '$' + totalProfit.toFixed(2);
            statNetProfit.className = totalProfit > 0 ? 'value-positive' : totalProfit < 0 ? 'value-negative' : 'value-neutral';
            statWins.textContent = wins;
            statLosses.textContent = losses;
            statStreak.textContent = bestStreak;
            statMonth.textContent = monthCount;
        }

        // ─── DELETE ──────────────────────────────────────────────────
        function deleteTrade(id) {
            trades = trades.filter(t => t.id !== id);
            saveTrades();
            applyFiltersAndRender();
        }

        // ─── FILTER ──────────────────────────────────────────────────
        function applyFiltersAndRender() {
            const pair = filterPair.value.trim().toLowerCase();
            const direction = filterDirection.value;
            const result = filterResult.value;
            const from = filterDateFrom.value;
            const to = filterDateTo.value;

            filteredTrades = trades.filter(t => {
                if (pair && !(t.pair || '').toLowerCase().includes(pair)) return false;
                if (direction && (t.direction || '').toUpperCase() !== direction) return false;
                if (result && (t.result || '') !== result) return false;
                if (from) { try { if (new Date(t.date) < new Date(from)) return false; } catch { return false; } }
                if (to) {
                    try {
                        const d = new Date(t.date);
                        const toDate = new Date(to); toDate.setHours(23,59,59,999);
                        if (d > toDate) return false;
                    } catch { return false; }
                }
                return true;
            });
            renderTable();
        }

        // ─── VIEW MODAL ──────────────────────────────────────────────
        function openViewModal(trade) {
            const fields = [
                { label: 'Date', value: trade.date || '-' },
                { label: 'Time', value: trade.time || '-' },
                { label: 'Pair', value: trade.pair || '-' },
                { label: 'Direction', value: trade.direction || '-' },
                { label: 'Session', value: trade.session || '-' },
                { label: 'Broker', value: trade.broker || '-' },
                { label: 'Account', value: trade.account || '-' },
                { label: 'Lot Size', value: trade.lotSize || '-' },
                { label: 'Entry', value: trade.entry ?? '-' },
                { label: 'Stop Loss', value: trade.stopLoss ?? '-' },
                { label: 'Take Profit', value: trade.takeProfit ?? '-' },
                { label: 'Risk %', value: trade.risk ?? '-' },
                { label: 'RR', value: trade.rr ?? '-' },
                { label: 'P/L', value: trade.profit ? `$${trade.profit}` : '-' },
                { label: 'Commission', value: trade.commission ? `$${trade.commission}` : '-' },
                { label: 'Result', value: trade.result || '-' },
                { label: 'Confidence', value: trade.confidence || '-' },
                { label: 'Emotion', value: trade.emotion || '-' },
                { label: 'Discipline', value: trade.discipline || '-' },
                { label: 'Patience', value: trade.patience || '-' },
                { label: 'Summary', value: trade.tradeSummary || '-' },
                { label: 'Strengths', value: trade.strengths || '-' },
                { label: 'Mistakes', value: trade.mistakes || '-' },
                { label: 'Lesson', value: trade.lessonLearned || '-' },
                { label: 'Improvement', value: trade.improvementPlan || '-' },
                { label: 'Before Chart', value: trade.beforeChart ? `<a href="${trade.beforeChart}" target="_blank">${trade.beforeChart}</a>` : '-' },
                { label: 'During Chart', value: trade.duringChart ? `<a href="${trade.duringChart}" target="_blank">${trade.duringChart}</a>` : '-' },
                { label: 'After Chart', value: trade.afterChart ? `<a href="${trade.afterChart}" target="_blank">${trade.afterChart}</a>` : '-' },
                { label: 'Notes', value: trade.notes || '-' },
                { label: 'HTF Swing', value: trade.htfSwing || '-' },
                { label: 'HTF Internal', value: trade.htfInternal || '-' },
                { label: 'MTF Swing', value: trade.mtfSwing || '-' },
                { label: 'MTF Internal', value: trade.mtfInternal || '-' },
                { label: 'LTF Structure', value: trade.ltfStructure || '-' },
                { label: 'Liquidity', value: trade.liquidity || '-' },
                { label: 'POI', value: trade.poi || '-' },
                { label: 'Entry Model', value: trade.entryModel || '-' },
                { label: 'Confirmation', value: trade.entryConfirmation || '-' },
                { label: 'Trade Valid', value: trade.tradeValid || '-' },
                { label: 'Confluences', value: getConfluenceLabels(trade.confluences) || '-' }
            ];

            let html = '';
            fields.forEach(f => {
                html += `<div class="detail-row"><div class="label">${f.label}</div><div class="value">${f.value}</div></div>`;
            });
            modalBody.innerHTML = html;
            modal.classList.add('active');
        }

        function getConfluenceLabels(confluences) {
            if (!confluences) return '';
            const labels = [];
            const map = {
                htfSwing: 'HTF Swing', htfInternal: 'HTF Internal',
                mtfSwing: 'MTF Swing', mtfInternal: 'MTF Internal',
                htfDemand: 'HTF Demand', htfSupply: 'HTF Supply',
                mtfDemand: 'MTF Demand', mtfSupply: 'MTF Supply',
                premium: 'Premium', discount: 'Discount',
                sweep: 'Liquidity Sweep', choch: 'CHOCH',
                bos: 'BOS', mitigation: 'POI Mitigation',
                refined: 'Refined POI', extreme: 'Extreme POI'
            };
            Object.keys(confluences).forEach(key => {
                if (confluences[key]) labels.push(map[key] || key);
            });
            return labels.length ? labels.join(', ') : '';
        }

        closeModal.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        // ─── EXPORT ──────────────────────────────────────────────────
        function exportCSV() {
            if (filteredTrades.length === 0) { alert('No trades to export.'); return; }
            const headers = ['Date','Pair','Direction','Entry','Stop Loss','Take Profit','RR','Profit','Result','Notes'];
            const rows = filteredTrades.map(t => [
                t.date || '', t.pair || '', t.direction || '',
                t.entry ?? '', t.stopLoss ?? '', t.takeProfit ?? '',
                t.rr ?? '', t.profit ?? '', t.result || '',
                (t.notes || '').replace(/,/g, ';')
            ]);
            let csv = headers.join(',') + '\n';
            rows.forEach(row => csv += row.join(',') + '\n');
            downloadFile(csv, 'trades_export.csv', 'text/csv');
        }

        function exportJSON() {
            if (filteredTrades.length === 0) { alert('No trades to export.'); return; }
            downloadFile(JSON.stringify(filteredTrades, null, 2), 'trades_export.json', 'application/json');
        }

        function downloadFile(content, filename, mime) {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ─── CLEAR ALL ──────────────────────────────────────────────
        function clearAll() {
            if (trades.length === 0) { alert('No trades to clear.'); return; }
            if (confirm('⚠️ Delete ALL trades? This cannot be undone.')) {
                trades = [];
                saveTrades();
                applyFiltersAndRender();
            }
        }

        // ─── SORTING ─────────────────────────────────────────────────
        function setupSorting() {
            document.querySelectorAll('thead th[data-sort]').forEach(th => {
                th.addEventListener('click', function() {
                    const key = this.dataset.sort;
                    if (sortKey === key) sortAsc = !sortAsc;
                    else { sortKey = key; sortAsc = false; }
                    renderTable();
                });
            });
        }

        // ─── SCROLL TOP ─────────────────────────────────────────────
        const scrollBtn = document.getElementById('scrollTopBtn');
        if (scrollBtn) {
            window.addEventListener('scroll', () => scrollBtn.classList.toggle('visible', window.scrollY > 300));
            scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        // ─── LOGOUT ──────────────────────────────────────────────────
        document.getElementById('logoutBtn')?.addEventListener('click', function() {
            if (confirm('Logout?')) window.location.href = 'index.html';
        });

        // ─── INIT ────────────────────────────────────────────────────
        function init() {
            loadTrades();
            applyFiltersAndRender();
            setupSorting();

            applyBtn.addEventListener('click', applyFiltersAndRender);
            resetBtn.addEventListener('click', function() {
                filterPair.value = '';
                filterDirection.value = '';
                filterResult.value = '';
                filterDateFrom.value = '';
                filterDateTo.value = '';
                applyFiltersAndRender();
            });
            document.querySelectorAll('.filter-group input, .filter-group select').forEach(el => {
                el.addEventListener('keydown', e => { if (e.key === 'Enter') applyFiltersAndRender(); });
            });

            exportCSVBtn.addEventListener('click', exportCSV);
            exportJSONBtn.addEventListener('click', exportJSON);
            clearAllBtn.addEventListener('click', clearAll);

            window.addEventListener('storage', function(e) {
                if (e.key === STORAGE_KEY) { loadTrades(); applyFiltersAndRender(); }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
        if (document.readyState === 'complete' || document.readyState === 'interactive') init();
    </script>
