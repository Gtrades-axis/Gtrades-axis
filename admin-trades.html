<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Manage Public Trades</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    body { background: #070a12; color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #4f7cff; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #121a29; border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #1e2740; }
    th { background: #0b1018; color: #9aa4bf; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    tr:hover { background: #1a2438; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge.public { background: rgba(0,200,151,0.15); color: #00c897; }
    .badge.private { background: rgba(255,71,102,0.15); color: #ff4766; }
    .toggle-btn { padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 12px; transition: 0.3s; }
    .toggle-btn.make-public { background: #4f7cff; color: #fff; }
    .toggle-btn.make-public:hover { background: #3a66e0; }
    .toggle-btn.make-private { background: #ff4766; color: #fff; }
    .toggle-btn.make-private:hover { background: #d93a54; }
    .loading { text-align: center; padding: 40px; color: #9aa4bf; }
    .empty { text-align: center; padding: 40px; color: #9aa4bf; border: 1px dashed #1e2740; border-radius: 12px; }
    .refresh-btn { background: #1e2740; border: none; color: #fff; padding: 8px 18px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-family: inherit; }
    .refresh-btn:hover { background: #29334c; }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-flag"></i> Manage Public Trades</h1>
    <p style="color:#9aa4bf; margin-bottom:20px;">Toggle the switch to show/hide trades on the homepage.</p>
    <button class="refresh-btn" onclick="loadTrades()"><i class="fa-solid fa-rotate"></i> Refresh</button>
    <div id="tradeList">
      <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading trades...</div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
      }
    }
  </script>

  <script type="module">
    import { auth, db } from "/js/firebase.js";
    import { onAuthStateChanged } from "firebase/auth";
    import { collection, query, where, orderBy, getDocs, updateDoc, doc } from "firebase/firestore";

    const tradeList = document.getElementById('tradeList');

    // ---- Load all closed trades ----
    async function loadTrades() {
      tradeList.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading trades...</div>';
      try {
        const q = query(
          collection(db, "trades"),
          where("status", "==", "Closed"),
          orderBy("closed", "desc")
        );
        const snapshot = await getDocs(q);
        const trades = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        if (trades.length === 0) {
          tradeList.innerHTML = '<div class="empty">No closed trades yet.</div>';
          return;
        }

        tradeList.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Pair</th>
                <th>Direction</th>
                <th>RR</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${trades.map(t => {
                const isPublic = t.public === true;
                const dateStr = t.closed?.toDate ? t.closed.toDate().toLocaleDateString() : t.closed || t.date || '—';
                return `
                  <tr>
                    <td><strong>${t.pair || '??'}</strong></td>
                    <td>${t.direction || '—'}</td>
                    <td>${t.rr ? t.rr.toFixed(2) + 'R' : '—'}</td>
                    <td>${dateStr}</td>
                    <td><span class="badge ${isPublic ? 'public' : 'private'}">${isPublic ? 'Public' : 'Private'}</span></td>
                    <td>
                      <button class="toggle-btn ${isPublic ? 'make-private' : 'make-public'}" data-id="${t.id}" data-public="${isPublic}">
                        ${isPublic ? 'Hide' : 'Show on Homepage'}
                      </button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

        // ---- Attach event listeners to toggle buttons ----
        document.querySelectorAll('.toggle-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const tradeId = btn.dataset.id;
            const currentPublic = btn.dataset.public === 'true';
            const newPublic = !currentPublic;

            try {
              await updateDoc(doc(db, "trades", tradeId), { public: newPublic });
              // Refresh the list to show updated state
              loadTrades();
            } catch (error) {
              console.error("Failed to update public flag:", error);
              alert("Error updating trade. Check console.");
            }
          });
        });

      } catch (error) {
        console.error("Error loading trades:", error);
        tradeList.innerHTML = `<div class="empty" style="color:#ff4766;">Failed to load trades: ${error.message}</div>`;
      }
    }

    // ---- Auth check ----
    onAuthStateChanged(auth, user => {
      if (!user) {
        tradeList.innerHTML = '<div class="empty"><i class="fa-solid fa-lock"></i> Please log in as admin.</div>';
        return;
      }
      // Optional: check if user is admin (you can add a role check here)
      loadTrades();
    });

    // Expose loadTrades globally for the refresh button
    window.loadTrades = loadTrades;
  </script>
</body>
</html>
