<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Journal Trades</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#070a12;color:#fff;font-family:Poppins,sans-serif;padding:24px}.container{max-width:1400px;margin:auto}h1{color:#4f7cff;margin:0 0 6px}.sub{color:#9aa4bf;margin:0 0 22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar button,.toolbar select{background:#121a29;border:1px solid #2a3450;color:#fff;border-radius:8px;padding:10px 14px;font-family:inherit;cursor:pointer}.toolbar button:hover{border-color:#4f7cff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#121a29;border:1px solid #1e2740;border-radius:10px;padding:14px}.stat small{color:#9aa4bf}.stat strong{display:block;font-size:22px;margin-top:3px}.table-wrap{overflow:auto;background:#121a29;border:1px solid #1e2740;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:12px 14px;border-bottom:1px solid #1e2740;text-align:left;font-size:13px}th{background:#0b1018;color:#9aa4bf;font-size:11px;text-transform:uppercase}tr:hover{background:#1a2438}.badge{padding:4px 9px;border-radius:14px;font-size:10px;font-weight:700}.closed{background:rgba(0,200,151,.15);color:#00c897}.pending{background:rgba(245,166,35,.15);color:#f5a623}.public{background:rgba(79,124,255,.15);color:#4f7cff}.private{background:rgba(255,71,102,.12);color:#ff4766}.action{padding:7px 11px;border:1px solid #2a3450;background:#0b1018;color:#fff;border-radius:7px;cursor:pointer}.action:hover{border-color:#4f7cff}.loading,.empty{padding:45px;text-align:center;color:#9aa4bf}.error{color:#ff4766}.muted{color:#9aa4bf}.positive{color:#00c897}.negative{color:#ff4766}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}body{padding:14px}}
</style>
</head>
<body>
<div class="container">
<h1><i class="fa-solid fa-database"></i> Journal Trades</h1>
<p class="sub">This panel reads the same <strong>trades</strong> collection written by the GTRADES-AXIS Trading Journal. No trade data is copied or moved.</p>
<div class="stats"><div class="stat"><small>Total</small><strong id="total">0</strong></div><div class="stat"><small>Closed</small><strong id="closedCount">0</strong></div><div class="stat"><small>Pending</small><strong id="pendingCount">0</strong></div><div class="stat"><small>Public</small><strong id="publicCount">0</strong></div></div>
<div class="toolbar"><button id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button><select id="statusFilter"><option value="all">All Status</option><option value="Closed">Closed</option><option value="Pending">Pending</option></select><select id="publicFilter"><option value="all">All Visibility</option><option value="public">Public</option><option value="private">Private</option></select></div>
<div id="tradeList"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Reading journal...</div></div>
</div>
<script type="importmap">{ "imports": { "firebase": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js", "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js", "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js" } }</script>
<script type="module">
import {auth,db} from "/js/firebase.js";
import {onAuthStateChanged} from "firebase/auth";
import {collection,getDocs,updateDoc,doc} from "firebase/firestore";
const list=document.getElementById('tradeList'); let allTrades=[];
function dateValue(v){if(!v)return 0;if(typeof v?.toDate==='function')return v.toDate().getTime();const n=Date.parse(v);return Number.isNaN(n)?0:n}
function fmtDate(t){const d=t.closed||t.updatedAt||t.date; if(t.closed?.toDate)return t.closed.toDate().toLocaleString(); if(t.date){return (t.date+' '+(t.time||'')).trim()} return d||'—'}
function money(n){return (Number(n)||0).toFixed(2)}
function render(){const sf=document.getElementById('statusFilter').value,pf=document.getElementById('publicFilter').value;let rows=allTrades.filter(t=>(sf==='all'||t.status===sf)&&(pf==='all'||(pf==='public'?t.public===true:t.public!==true)));rows.sort((a,b)=>dateValue(b.closed||b.updatedAt||b.createdAt)-dateValue(a.closed||a.updatedAt||a.createdAt));document.getElementById('total').textContent=allTrades.length;document.getElementById('closedCount').textContent=allTrades.filter(t=>t.status==='Closed').length;document.getElementById('pendingCount').textContent=allTrades.filter(t=>t.status==='Pending'||t.result==='Pending').length;document.getElementById('publicCount').textContent=allTrades.filter(t=>t.public===true).length;if(!rows.length){list.innerHTML='<div class="empty">No journal trades match this filter.</div>';return}list.innerHTML='<div class="table-wrap"><table><thead><tr><th>Date / Time</th><th>Account</th><th>Pair</th><th>Direction</th><th>Result</th><th>RR</th><th>P/L</th><th>Risk %</th><th>Visibility</th><th>Action</th></tr></thead><tbody>'+rows.map(t=>{const pub=t.public===true;const rr=Number(t.rr)||0;const pl=(Number(t.profit)||0)-(Number(t.commission)||0);return '<tr><td>'+fmtDate(t)+'</td><td>'+(t.account||t.accountId||'—')+'</td><td><strong>'+(t.pair||'—')+'</strong></td><td>'+(t.direction||'—')+'</td><td><span class="badge '+(t.status==='Closed'?'closed':'pending')+'">'+(t.result||t.status||'—')+'</span></td><td class="'+(rr>=0?'positive':'negative')+'">'+rr.toFixed(2)+'R</td><td class="'+(pl>=0?'positive':'negative')+'">'+(pl>=0?'+':'')+'$'+money(pl)+'</td><td>'+money(t.risk)+'%</td><td><span class="badge '+(pub?'public':'private')+'">'+(pub?'Public':'Private')+'</span></td><td><button class="action" data-id="'+String(t.id).replace(/"/g,'&quot;')+'" data-public="'+pub+'">'+(pub?'Hide':'Show')+'</button></td></tr>'}).join('')+'</tbody></table></div>';document.querySelectorAll('.action').forEach(b=>b.onclick=async()=>{try{b.disabled=true;await updateDoc(doc(db,'trades',b.dataset.id),{public:b.dataset.public!=='true'});await loadTrades()}catch(e){console.error(e);alert('Could not update visibility: '+e.message)}finally{b.disabled=false}})}
async function loadTrades(){list.innerHTML='<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Reading journal trades...</div>';try{const snap=await getDocs(collection(db,'trades'));allTrades=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.error('Journal trades read failed:',e);list.innerHTML='<div class="empty error">Failed to read the Journal trades.<br><span class="muted">'+e.message+'</span></div>'}}
document.getElementById('refreshBtn').onclick=loadTrades;document.getElementById('statusFilter').onchange=render;document.getElementById('publicFilter').onchange=render;onAuthStateChanged(auth,user=>{if(!user){list.innerHTML='<div class="empty error"><i class="fa-solid fa-lock"></i> Please log in.</div>';return}loadTrades()});
</script>
</body></html>
