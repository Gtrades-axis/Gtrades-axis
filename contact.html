<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | GTRADES-AXIS™</title>
  <meta name="description" content="Get in touch with GTRADES-AXIS™ – Telegram, WhatsApp, TikTok, Phone and email." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="icon" href="images/favicon.png" />
  <!-- Include your existing styles here – I've kept them but you can reuse your own -->

    /* (paste your existing styles – same as before) */
    /* For brevity, I'm omitting the full CSS here; you already have it. */
    /* Just ensure you keep the same styles as your current contact page. */
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="container">
      <div class="logo">
        <img src="images/imageslogo.png.png" alt="GTRADES-AXIS Logo" />
        <h2>GTRADES-<span>AXIS™</span></h2>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#academy">Academy</a></li>
          <li><a href="index.html#strategy">Strategy</a></li>
          <li><a href="index.html#community">Community</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-buttons">
        <a href="https://www.youtube.com/@GtradesAxis" target="_blank" class="youtube"><i class="fab fa-youtube"></i></a>
        <a href="https://t.me/+iywzAr5VaI80Mjhk" target="_blank" class="telegram"><i class="fab fa-telegram"></i></a>
        <a href="https://wa.me/254712416214" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
        <a href="https://www.tiktok.com/@gtrades_axis" target="_blank" class="tiktok"><i class="fab fa-tiktok"></i></a>
        <a href="login.html" class="join-btn" id="loginBtn">Login</a>
        <a href="dashboard.html" class="join-btn dashboard-btn" id="dashboardBtn" style="display:none;">Dashboard</a>
      </div>
    </div>
  </header>

  <!-- ===== CONTACT SECTION ===== -->
  <section class="contact-wrapper">
    <div class="container">
      <div class="section-title">
        <h2>Get in Touch</h2>
        <p>We’re here to help. Reach out through any of the channels below.</p>
      </div>

      <div class="contact-grid">
        <!-- LEFT – Contact Info (unchanged) -->
        <div class="contact-info">
          <!-- ... your info cards ... -->
        </div>

        <!-- RIGHT – Contact Form -->
        <div class="form-card">
          <h3>Send a Message</h3>
          <p>We’ll get back to you as soon as possible.</p>

          <!-- ✅ CORRECT ENDPOINT: meeyyydb (3 y's) -->
          <form
            id="contactForm"
            action="https://formspree.io/f/meeyyydb"
            method="POST"
          >
            <div class="form-group">
              <label for="name">Your Name</label>
              <input type="text" id="name" name="name" placeholder="John Doe" required />
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="john@example.com" required />
            </div>
            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" placeholder="Trading inquiry" />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="Tell us how we can help…" required></textarea>
            </div>

            <!-- Redirect back to contact page with success param -->
            <input type="hidden" name="_redirect" value="https://gtradesaxis.com/contact.html?success=true" />

            <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
          </form>

          <div id="formStatus"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <!-- ... your footer ... -->
  </footer>

  <script>
    // ─── Auth Buttons (same as before) ──────────────────────────
    const isLoggedIn = localStorage.getItem('userLoggedIn') === 'true';
    const loginBtn = document.getElementById('loginBtn');
    const dashboardBtn = document.getElementById('dashboardBtn');
    if (isLoggedIn) {
      loginBtn.style.display = 'none';
      dashboardBtn.style.display = 'inline-flex';
    } else {
      loginBtn.style.display = 'inline-flex';
      dashboardBtn.style.display = 'none';
    }

    // ─── Form Status ──────────────────────────────────────────
    const form = document.getElementById('contactForm');
    const status = document.getElementById('formStatus');
    const submitBtn = document.getElementById('submitBtn');

    // Show loading when submitting (the form will redirect)
    form.addEventListener('submit', function() {
      status.className = 'loading';
      status.textContent = '⏳ Sending your message...';
      status.style.display = 'block';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
    });

    // If redirected back with success=true, show success message
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('success') === 'true') {
      status.className = 'success';
      status.textContent = '✅ Your message has been sent! We\'ll get back to you soon.';
      status.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Message';
    }
  </script>
</body>
</html>
