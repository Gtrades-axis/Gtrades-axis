<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTRADES-AXIS™ | Video Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #070b12;
    color: #ffffff;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
}

.header {
    margin-bottom: 30px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.header p {
    margin: 0;
    color: #8f9aaa;
}

.card {
    background: #0d131d;
    border: 1px solid #1c2735;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

input,
select {
    width: 100%;
    padding: 13px 14px;
    border-radius: 9px;
    border: 1px solid #273445;
    background: #080d15;
    color: #fff;
    outline: none;
    font-size: 15px;
}

input:focus,
select:focus {
    border-color: #2388ff;
}

.checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
}

.checkbox input {
    width: auto;
}

.preview {
    width: 100%;
    max-height: 400px;
    margin-top: 15px;
    border-radius: 10px;
    display: none;
    background: #000;
}

.upload-btn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #1683ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.upload-btn:hover {
    background: #006fe6;
}

.upload-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#progressBox {
    display: none;
    margin-top: 25px;
}

.progress {
    height: 12px;
    background: #17202d;
    border-radius: 20px;
    overflow: hidden;
}

#bar {
    width: 0%;
    height: 100%;
    background: #1683ff;
    transition: width .2s ease;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    color: #9da9b8;
    font-size: 13px;
}

#status {
    display: none;
    margin-top: 20px;
    padding: 13px;
    border-radius: 8px;
}

#status.success {
    display: block;
    background: rgba(30, 180, 100, .12);
    border: 1px solid #1eb464;
    color: #54e69a;
}

#status.error {
    display: block;
    background: rgba(230, 50, 50, .12);
    border: 1px solid #e33;
    color: #ff7777;
}

.back {
    display: inline-block;
    margin-bottom: 25px;
    color: #1683ff;
    text-decoration: none;
}

.back:hover {
    text-decoration: underline;
}

.note {
    color: #7f8b9b;
    font-size: 13px;
    margin-top: 7px;
}

@media (max-width: 600px) {
    .container {
        padding: 25px 15px;
    }

    .card {
        padding: 20px;
    }

    .header h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <a href="admin.html" class="back">← Back to Admin</a>

    <div class="header">
        <h1>🎥 Video Manager</h1>
        <p>Upload academy videos to GTRADES-AXIS™</p>
    </div>

    <div class="card">

        <form id="videoUploadForm">

            <div class="form-group">
                <label for="videoTitle">Video Title</label>
                <input
                    type="text"
                    id="videoTitle"
                    placeholder="e.g. Understanding Market Structure"
                    required
                >
            </div>

            <div class="form-group">
                <label for="videoCategory">Category</label>

                <select id="videoCategory" required>
                    <option value="">Select category</option>
                    <option value="Introduction">Introduction</option>
                    <option value="Market Structure">Market Structure</option>
                    <option value="Liquidity">Liquidity</option>
                    <option value="Supply & Demand">Supply & Demand</option>
                    <option value="Trade Entries">Trade Entries</option>
                    <option value="Risk Management">Risk Management</option>
                    <option value="Trading Psychology">Trading Psychology</option>
                    <option value="Gold Analysis">Gold Analysis</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="videoDuration">Duration</label>

                <input
                    type="text"
                    id="videoDuration"
                    placeholder="e.g. 12:45"
                >
            </div>

            <div class="form-group">
                <label for="videoFile">Video File</label>

                <input
                    type="file"
                    id="videoFile"
                    accept="video/*"
                    required
                >

                <div class="note">
                    Select the actual video file you want to upload.
                </div>

                <video
                    id="preview"
                    class="preview"
                    controls
                ></video>
            </div>

            <div class="form-group">
                <label for="videoThumbnail">
                    Thumbnail
                </label>

                <input
                    type="file"
                    id="videoThumbnail"
                    accept="image/*"
                >
            </div>

            <div class="form-group checkbox">

                <input
                    type="checkbox"
                    id="premiumOnly"
                >

                <label for="premiumOnly">
                    Premium members only
                </label>

            </div>

            <button
                type="submit"
                id="uploadVideoBtn"
                class="upload-btn"
            >
                ☁ Upload Video
            </button>

        </form>

        <div id="progressBox">

            <div class="progress">
                <div id="bar"></div>
            </div>

            <div class="progress-info">
                <span id="progressText">
                    Preparing upload...
                </span>

                <span id="percent">
                    0%
                </span>
            </div>

        </div>

        <div id="status"></div>

    </div>

</div>

<script type="module" src="./admin-videos.js"></script>

</body>
</html>
