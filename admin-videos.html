<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Video Manager | GTRADES-AXIS™</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:#080b12;
  color:#e8edf5;
}

.admin{
  max-width:1400px;
  margin:auto;
  padding:35px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.header h1{
  margin:0;
}

.header p{
  color:#94a3b8;
}

.panel{
  background:#111624;
  border:1px solid #29344e;
  border-radius:14px;
  padding:25px;
  margin-bottom:25px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:#94a3b8;
  font-size:.85rem;
}

input,
select{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #29344e;
  background:#0b0f18;
  color:#fff;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:10px;
}

.checkbox input{
  width:auto;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 18px;
  cursor:pointer;
  font-weight:600;
}

.primary{
  background:#4f7cff;
  color:#fff;
}

.secondary{
  background:#1d2639;
  color:#fff;
}

.danger{
  background:#3a1520;
  color:#ff6b81;
}

.progress{
  display:none;
  margin-top:20px;
}

.progress-bar{
  width:100%;
  height:8px;
  background:#20283a;
  border-radius:10px;
  overflow:hidden;
}

.progress-fill{
  width:0;
  height:100%;
  background:#4f7cff;
}

.table-wrapper{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  text-align:left;
  padding:14px;
  border-bottom:1px solid #29344e;
}

th{
  color:#94a3b8;
  font-size:.8rem;
}

.thumb{
  width:80px;
  height:45px;
  object-fit:cover;
  border-radius:6px;
}

.badge{
  padding:4px 9px;
  border-radius:20px;
  font-size:.7rem;
}

.premium{
  background:#3d2c0c;
  color:#f5a623;
}

.free{
  background:#0b352b;
  color:#00c897;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

@media(max-width:800px){

  .admin{
    padding:20px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

}

</style>

</head>

<body>

<div class="admin">

<div class="header">

<div>

<h1>
GTRADES-AXIS™ Video Manager
</h1>

<p>
Upload and manage private R2 video content.
</p>

</div>

<button
id="logoutBtn"
class="danger"
>
Logout
</button>

</div>


<div class="panel">

<h2 id="formTitle">
Add Video
</h2>

<form id="videoForm">

<div class="form-grid">


<div class="field">

<label>
Video Title
</label>

<input
id="videoTitle"
required
>

</div>


<div class="field">

<label>
Category
</label>

<select id="videoCategory">

<option>
Market Structure
</option>

<option>
Supply & Demand
</option>

<option>
Liquidity
</option>

<option>
Entries
</option>

<option>
Psychology
</option>

</select>

</div>


<div class="field">

<label>
Duration
</label>

<input
id="videoDuration"
placeholder="12:45"
required
>

</div>


<div class="field">

<label>
Video File
</label>

<input
id="videoFile"
type="file"
accept="video/*"
>

</div>


<div class="field">

<label>
Thumbnail
</label>

<input
id="thumbnailFile"
type="file"
accept="image/*"
>

</div>


<div class="field">

<label>
Access
</label>

<div class="checkbox">

<input
id="videoPremiumOnly"
type="checkbox"
checked
>

<span>
Premium Only
</span>

</div>

</div>


<div class="field full">

<label>
Description
</label>

<input
id="videoDescription"
placeholder="Optional video description"
>

</div>


</div>


<div
style="
margin-top:20px;
display:flex;
gap:10px;
"
>

<button
class="primary"
type="submit"
id="saveBtn"
>
Upload Video
</button>

<button
class="secondary"
type="button"
id="cancelBtn"
>
Cancel
</button>

</div>


<div
class="progress"
id="progress"
>

<p id="progressText">
Uploading...
</p>

<div class="progress-bar">

<div
id="progressFill"
class="progress-fill"
></div>

</div>

</div>

</form>

</div>


<div class="panel">

<h2>
Video Library
</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>
Thumbnail
</th>

<th>
Title
</th>

<th>
Category
</th>

<th>
Access
</th>

<th>
Actions
</th>

</tr>

</thead>

<tbody id="videoTableBody">

</tbody>

</table>

</div>

</div>

</div>


<script type="importmap">
{
  "imports":{
    "firebase/auth":
      "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",

    "firebase/firestore":
      "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js",

    "firebase/functions":
      "https://www.gstatic.com/firebasejs/11.9.1/firebase-functions.js"
  }
}
</script>

<script
type="module"
src="./js/admin-videos.js"
></script>

</body>

</html>
