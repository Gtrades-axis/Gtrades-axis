<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | GTRADES-AXIS™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="css/login.css" />
    <style>
        /* Quick inline styles – move to login.css later */
        .password-group {
            position: relative;
        }
        .password-group input {
            padding-right: 48px; /* space for the eye icon */
        }
        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 1.1rem;
            padding: 0;
        }
        .toggle-pw:hover {
            color: #333;
        }

        /* Forgot link row – below the password */
        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            margin-bottom: 18px;
        }
        .forgot-link {
            font-size: 0.85rem;
            color: #6c63ff;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Google button & "or" divider */
        .google-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 30px;
            background: #fff;
            font-weight: 500;
            font-size: 1rem;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            margin-bottom: 16px;
        }
        .google-btn:hover {
            background: #f8f9fa;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .google-btn i {
            font-size: 1.3rem;
        }

        .divider-or {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #aaa;
            font-size: 0.85rem;
            margin: 0 0 20px 0;
        }
        .divider-or::before,
        .divider-or::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        /* Error Message Styles */
        .msg.error {
            background: rgba(255, 71, 102, 0.15);
            color: #ff4766;
            border: 1px solid #ff4766;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        /* Small spacing tweaks */
        .login-btn {
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <!-- Logo -->
            <div class="logo-wrapper">
                <img
                    src="images/imageslogo.png.png"
                    alt="GTRADES-AXIS Logo"
                    class="login-logo"
                    draggable="false"
                />
            </div>

            <h1>Welcome <span class="gradient-text">Back</span></h1>
            <p class="subtitle">Login to access your Academy Resources</p>

            <!-- Google Sign-in -->
            <button class="google-btn" id="googleLoginBtn">
                <i class="fa-brands fa-google"></i> Sign in with Google
            </button>

            <!-- Divider "or" -->
            <div class="divider-or">or</div>

            <!-- Error message -->
            <div id="errorMsg" class="msg error" style="display:none;"></div>

            <form id="loginForm">
                <!-- Email -->
                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address" required />
                </div>

                <!-- Password (with toggle eye) -->
                <div class="input-group password-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required />
                    <button type="button" class="toggle-pw" id="togglePassword">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <!-- 🔽 Forgot password -->
                <div class="forgot-row">
                    <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Log In</span>
                </button>
            </form>

            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-text">secure access</span>
                <span class="divider-line"></span>
            </div>

            <div class="login-links">
                Don't have an account? <a href="register.html">Create one</a>
            </div>

            <a class="back-home" href="index.html">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <!-- ===========================
         SCRIPTS (Firebase Imports)
    =========================== -->
    <script type="importmap">
    {
      "imports": {
        "firebase": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
      }
    }
    </script>

    <!-- ===========================
         MAIN MODULE SCRIPT
    =========================== -->
    <script type="module">
        import { auth } from "./js/firebase.js";
        import { 
            signInWithPopup, 
            GoogleAuthProvider, 
            signInWithEmailAndPassword,
            sendPasswordResetEmail 
        } from "firebase/auth";

        // ─── DOM REFS ──────────────────────────────────────────
        const googleBtn = document.getElementById('googleLoginBtn');
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const forgotLink = document.getElementById('forgotPasswordLink');

        // ─── TOGGLE PASSWORD VISIBILITY ──────────────────────
        const toggleBtn = document.getElementById('togglePassword');
        toggleBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = this.querySelector('i');
            if (icon) {
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            }
        });

        // ─── HELPER: SHOW ERROR ──────────────────────────────
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        function hideError() {
            errorMsg.style.display = 'none';
        }

        // ─── 1. GOOGLE SIGN IN (POPUP) ──────────────────────
        googleBtn.addEventListener('click', async function() {
            hideError();
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                window.location.href = 'admin.html'; // Redirect to dashboard upon success
            } catch (error) {
                console.error("Google Login Error:", error);
                if (error.code === 'auth/popup-blocked') {
                    showError("Popup was blocked by your browser. Please allow popups for this site.");
                } else if (error.code === 'auth/unauthorized-domain') {
                    showError("Domain not authorized. Please add 'gtrades-axis.github.io' to Firebase authorized domains.");
                } else {
                    showError("Google Login failed: " + error.message);
                }
            }
        });

        // ─── 2. EMAIL & PASSWORD SIGN IN ─────────────────────
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideError();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showError("Please enter both email and password.");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'admin.html'; // Redirect to dashboard
            } catch (error) {
                console.error("Email Login Error:", error);
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    showError("Invalid email or password.");
                } else if (error.code === 'auth/too-many-requests') {
                    showError("Too many failed attempts. Please wait and try again.");
                } else {
                    showError("Login failed: " + error.message);
                }
            }
        });

        // ─── 3. FORGOT PASSWORD ──────────────────────────────
        forgotLink.addEventListener('click', async function(e) {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) {
                showError("Please enter your email address in the email field first to reset your password.");
                return;
            }
            if (!confirm(`Send a password reset email to ${email}?`)) return;

            try {
                await sendPasswordResetEmail(auth, email);
                alert("Password reset email sent successfully! Check your inbox.");
                hideError();
            } catch (error) {
                console.error("Forgot password error:", error);
                if (error.code === 'auth/user-not-found') {
                    showError("No account found with this email address.");
                } else {
                    showError("Failed to send reset email: " + error.message);
                }
            }
        });

        console.log("✅ Login Page ready with Google Popup fix.");
    </script>

</body>
</html>
