<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTRADES-AXIS™ · Payments</title>

    <!-- Firebase SDKs -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
            }
        }
    </script>

    <!-- Google Font + Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ==========================================================
           GTRADES-AXIS™ · ADMIN PAYMENTS
           Complete Styles
           ========================================================== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0d15;
            --bg-secondary: #12141f;
            --bg-card: #1a1d2e;
            --bg-card-hover: #22263b;
            --border-color: #2a2f45;
            --text-primary: #f0f2fa;
            --text-secondary: #9aa1b9;
            --text-muted: #6a7188;
            --gold: #f5b342;
            --gold-dim: rgba(245, 179, 66, 0.12);
            --green: #3dd68c;
            --green-dim: rgba(61, 214, 140, 0.12);
            --red: #f25a6a;
            --red-dim: rgba(242, 90, 106, 0.12);
            --blue: #4b7bec;
            --blue-dim: rgba(75, 123, 236, 0.12);
            --radius: 12px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --transition: 0.2s ease;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* ----- SIDEBAR ----- */
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            padding: 28px 20px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--gold);
            margin-bottom: 36px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand i {
            font-size: 1.5rem;
            color: var(--gold);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius);
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .sidebar-nav a i {
            width: 20px;
            font-size: 1rem;
            text-align: center;
        }

        .sidebar-nav a:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .sidebar-nav a.active {
            background: var(--gold-dim);
            color: var(--gold);
            font-weight: 600;
        }

        .sidebar-nav a.active i {
            color: var(--gold);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .sidebar-footer .admin-badge {
            display: inline-block;
            background: var(--gold-dim);
            color: var(--gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 6px;
        }

        /* ----- MAIN CONTENT ----- */
        .main {
            flex: 1;
            padding: 32px 40px 60px;
            max-width: calc(100% - 260px);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header h1 i {
            color: var(--gold);
            font-size: 1.5rem;
        }

        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions .refresh-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions .refresh-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .header-actions .refresh-btn i {
            font-size: 0.9rem;
        }

        /* ----- STATS ROW ----- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 20px;
            transition: var(--transition);
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-muted);
        }

        .stat-card .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-card .value.pending {
            color: var(--gold);
        }
        .stat-card .value.approved {
            color: var(--green);
        }
        .stat-card .value.rejected {
            color: var(--red);
        }

        /* ----- TABLE WRAPPER ----- */
        .table-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 700px;
        }

        thead {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        thead th {
            text-align: left;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--bg-card-hover);
        }

        tbody td {
            padding: 14px 18px;
            vertical-align: middle;
            color: var(--text-secondary);
            word-break: break-word;
        }

        tbody td:first-child {
            font-weight: 500;
            color: var(--text-primary);
        }

        /* ----- STATUS BADGE ----- */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: capitalize;
            letter-spacing: 0.02em;
            background: var(--bg-secondary);
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .status.pending {
            background: var(--gold-dim);
            color: var(--gold);
            border-color: rgba(245, 179, 66, 0.2);
        }

        .status.approved {
            background: var(--green-dim);
            color: var(--green);
            border-color: rgba(61, 214, 140, 0.2);
        }

        .status.rejected {
            background: var(--red-dim);
            color: var(--red);
            border-color: rgba(242, 90, 106, 0.2);
        }

        /* ----- ACTION BUTTONS ----- */
        .action-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-group button {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-group .approve-btn {
            background: var(--green);
            color: #0b0d15;
        }

        .action-group .approve-btn:hover {
            background: #4de0a0;
            transform: scale(1.02);
        }

        .action-group .reject-btn {
            background: var(--red);
            color: #0b0d15;
        }

        .action-group .reject-btn:hover {
            background: #f57382;
            transform: scale(1.02);
        }

        .action-group .completed-label {
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* proof link */
        .proof-link {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
            border-bottom: 1px dotted var(--blue-dim);
            transition: var(--transition);
        }

        .proof-link:hover {
            color: #6b8ff5;
            border-bottom-color: var(--blue);
        }

        .proof-link i {
            font-size: 0.7rem;
            margin-left: 4px;
        }

        .no-proof {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* ----- EMPTY STATE ----- */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.5rem;
            color: var(--border-color);
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
                padding: 20px 12px;
            }

            .sidebar-brand span {
                display: none;
            }

            .sidebar-nav a span {
                display: none;
            }

            .sidebar-nav a {
                justify-content: center;
                padding: 14px;
            }

            .sidebar-nav a i {
                font-size: 1.2rem;
                margin: 0;
            }

            .sidebar-footer {
                text-align: center;
            }
            .sidebar-footer .admin-badge {
                font-size: 0.6rem;
                padding: 2px 10px;
            }

            .main {
                max-width: calc(100% - 80px);
                padding: 24px 20px 40px;
            }
        }

        @media (max-width: 640px) {
            .sidebar {
                width: 60px;
                padding: 16px 8px;
            }

            .main {
                max-width: calc(100% - 60px);
                padding: 16px 12px 32px;
            }

            .page-header h1 {
                font-size: 1.3rem;
            }

            .stats-row {
                grid-template-columns: 1fr 1fr;
            }

            .header-actions .refresh-btn span {
                display: none;
            }

            table {
                font-size: 0.75rem;
                min-width: 600px;
            }

            thead th,
            tbody td {
                padding: 10px 12px;
            }

            .action-group button {
                padding: 4px 12px;
                font-size: 0.65rem;
            }
        }

        @media (max-width: 480px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- ==========================================================
    SIDEBAR
    ========================================================== -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-chart-line"></i>
            <span>GTRADES·AXIS</span>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="admin-payments.html" class="active">
                <i class="fas fa-credit-card"></i>
                <span>Payments</span>
            </a>
            <a href="admin-users.html">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="admin-logs.html">
                <i class="fas fa-clipboard-list"></i>
                <span>Audit Logs</span>
            </a>
            <a href="settings.html">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="admin-badge">
                <i class="fas fa-shield-alt"></i> Admin
            </div>
            <div style="margin-top:8px; font-size:0.7rem;">
                <i class="fas fa-circle" style="color:var(--green);font-size:0.5rem;"></i>
                Live
            </div>
        </div>
    </aside>

    <!-- ==========================================================
    MAIN CONTENT
    ========================================================== -->
    <main class="main">

        <!-- PAGE HEADER -->
        <div class="page-header">
            <div>
                <h1>
                    <i class="fas fa-credit-card"></i>
                    Payment Requests
                </h1>
                <div class="subtitle">
                    Review and manage all user payment submissions
                </div>
            </div>
            <div class="header-actions">
                <button class="refresh-btn" onclick="location.reload()">
                    <i class="fas fa-sync-alt"></i>
                    <span>Refresh</span>
                </button>
            </div>
        </div>

        <!-- STATS ROW -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="label">Pending</div>
                <div class="value pending" id="statPending">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Approved</div>
                <div class="value approved" id="statApproved">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Rejected</div>
                <div class="value rejected" id="statRejected">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total</div>
                <div class="value" id="statTotal">0</div>
            </div>
        </div>

        <!-- PAYMENTS TABLE -->
        <div class="table-wrapper">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Plan</th>
                            <th>Method</th>
                            <th>Proof</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsTable">
                        <!-- Rows injected by admin-payments.js -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ==========================================================
    FIREBASE CONFIG + INIT
    ========================================================== -->
    <script type="module">
        // ------------------------------------------------------------------
        // IMPORT FIREBASE MODULES
        // ------------------------------------------------------------------
        import { initializeApp } from "firebase/app";
        import { getAuth } from "firebase/auth";
        import { getFirestore } from "firebase/firestore";

        // ------------------------------------------------------------------
        // YOUR FIREBASE CONFIG — REPLACE WITH YOUR OWN
        // ------------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDummyReplaceWithYourActualKey",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        // ------------------------------------------------------------------
        // INIT FIREBASE
        // ------------------------------------------------------------------
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ------------------------------------------------------------------
        // EXPOSE FOR admin-payments.js
        // ------------------------------------------------------------------
        window.auth = auth;
        window.db = db;

        console.log("🔥 Firebase initialized from payments.html");
        console.log("📦 auth:", auth);
        console.log("📦 db:", db);

        // ------------------------------------------------------------------
        // DYNAMIC IMPORT OF admin-payments.js
        // (so it runs after Firebase is ready)
        // ------------------------------------------------------------------
        import("./admin-payments.js")
            .then(() => {
                console.log("✅ admin-payments.js loaded");
            })
            .catch((err) => {
                console.error("❌ Failed to load admin-payments.js:", err);
            });
    </script>

</body>
</html>
