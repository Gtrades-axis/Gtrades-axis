<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academy | GTRADES-AXIS™</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <!-- Academy Design System -->
  <link rel="stylesheet" href="css/academy.css" />

  <!-- Your existing global styles (if any) -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="academy-app">

  <!-- ====== SIDEBAR ====== -->
  <aside class="academy-sidebar">
    <div class="logo">
      <img src="images/logo.png" alt="GTRADES-AXIS" />
      <h2>GTRADES <span>AXIS™</span></h2>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a class="active" href="academy.html"><i class="fa-solid fa-graduation-cap"></i> Academy</a>
      <a href="resources.html"><i class="fa-solid fa-folder-open"></i> Resources</a>
      <a href="journal.html"><i class="fa-solid fa-book"></i> Journal</a>
      <a href="analytics.html"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
      <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
    </nav>
    <button id="logoutBtn" class="logout-btn">
      <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>
  </aside>

  <!-- ====== MAIN CONTENT ====== -->
  <main class="academy-main">

    <!-- Header -->
    <header class="academy-header">
      <div>
        <h1><i class="fa-solid fa-graduation-cap"></i> Premium Academy</h1>
        <p>Master Smart Money Concepts – structured, step by step.</p>
      </div>
      <div class="header-actions">
        <span id="userRole" class="role-badge">Premium</span>
        <a href="dashboard.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back</a>
      </div>
    </header>

    <!-- Welcome -->
    <section class="welcome-section">
      <div class="greeting">Welcome back, <span id="userName">Trader</span> 👋</div>
      <div class="date"><i class="fa-regular fa-calendar"></i> <span id="todayDate"></span></div>
    </section>

    <!-- Continue Learning -->
    <section class="continue-learning" id="continueSection">
      <div class="info">
        <div class="module-name" id="continueModule">Loading…</div>
        <div class="lesson-name" id="continueLesson">Loading…</div>
      </div>
      <a href="#" class="btn btn-primary" id="continueBtn">Continue ▶</a>
    </section>

    <!-- Overall Progress -->
    <section class="overall-progress">
      <div class="label"><span>Overall Progress</span><span id="progressPercent">0%</span></div>
      <div class="bar"><div class="fill" id="progressFill" style="width:0%;"></div></div>
    </section>

    <!-- Module Grid -->
    <section id="moduleGrid" class="module-grid">
      <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading modules…</div>
    </section>

    <!-- Achievements -->
    <section class="achievements" id="achievementsSection">
      <span class="badge"><i class="fa-regular fa-star"></i> Complete modules to earn achievements</span>
    </section>

  </main>
</div>

<!-- Scroll to top -->
<button id="scrollTopBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/academy.js"></script>

<script>
  (function() {
    const btn = document.getElementById('scrollTopBtn');
    if (!btn) return;
    window.addEventListener('scroll', function() {
      btn.classList.toggle('visible', window.scrollY > 250);
    });
    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();
</script>

</body>
</html>
