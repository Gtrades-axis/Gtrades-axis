<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTRADES-AXIS™ | My Profile</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ==========================================================
           GLOBAL RESET & BASE
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            margin: 0;
        }

        /* ==========================================================
           PROFILE CARD
           ========================================================== */
        .profile-section {
            width: 100%;
            max-width: 520px;
        }

        .profile-card {
            background: #1a1a2e;
            border-radius: 28px;
            padding: 36px 32px;
            border: 1px solid #2a2a4a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transition: box-shadow 0.3s ease;
        }

        .profile-card:hover {
            box-shadow: 0 24px 70px rgba(74, 108, 247, 0.12);
        }

        /* ==========================================================
           HEADER
           ========================================================== */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 1px solid #2a2a4a;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a6cf7, #6a4cf7);
            color: #fff;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(74, 108, 247, 0.25);
        }

        .profile-info {
            flex: 1;
            min-width: 0; /* prevent overflow */
        }

        .profile-info h2 {
            color: #f0f0f0;
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 4px;
            word-break: break-word;
        }

        .profile-info .email {
            color: #8892b0;
            font-size: 14px;
            margin: 0 0 8px;
            word-break: break-all;
        }

        .member-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .member-badge.free {
            background: #2a2a4a;
            color: #a8b2d1;
        }
        .member-badge.premium {
            background: #f7b731;
            color: #1a1a2e;
        }
        .member-badge.admin {
            background: #4a6cf7;
            color: #fff;
        }

        /* ==========================================================
           INFO GRID
           ========================================================== */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
            margin-bottom: 28px;
        }

        .info-card h4 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #667;
            margin: 0 0 4px;
            font-weight: 600;
        }

        .info-card p {
            font-weight: 600;
            color: #f0f0f0;
            font-size: 18px;
            margin: 0;
            word-break: break-word;
        }

        .info-card p.paid {
            color: #4ade80;
        }
        .info-card p.unpaid {
            color: #f5a0a0;
        }

        /* ==========================================================
           ACTIONS
           ========================================================== */
        .profile-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .profile-actions .upgrade-btn {
            flex: 1;
            min-width: 160px;
            padding: 12px 16px;
            background: #f7b731;
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .profile-actions .upgrade-btn:hover {
            background: #ffc84a;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(247, 183, 49, 0.25);
        }

        .profile-actions .upgrade-btn.hidden {
            display: none;
        }

        .profile-actions .logout-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            background: transparent;
            color: #8892b0;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .profile-actions .logout-btn:hover {
            background: #2a2a4a;
            color: #f0f0f0;
            border-color: #4a4a6a;
        }

        /* ==========================================================
           LOADING STATE
           ========================================================== */
        .loading-spinner {
            text-align: center;
            padding: 40px 20px;
            color: #8892b0;
        }

        .loading-spinner i {
            font-size: 32px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ==========================================================
           TOAST NOTIFICATION
           ========================================================== */
        .gtrades-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a2e;
            color: #f0f0f0;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a4a;
            z-index: 99999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .gtrades-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ==========================================================
           RESPONSIVE
           ========================================================== */
        @media (max-width: 600px) {
            body {
                padding: 16px 12px;
            }

            .profile-card {
                padding: 24px 18px;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }

            .profile-avatar {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }

            .profile-info h2 {
                font-size: 20px;
            }

            .profile-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .info-card p {
                font-size: 16px;
            }

            .profile-actions {
                flex-direction: column;
            }

            .profile-actions .upgrade-btn,
            .profile-actions .logout-btn {
                width: 100%;
                min-width: unset;
            }

            .gtrades-toast {
                white-space: normal;
                max-width: 90%;
                text-align: center;
                font-size: 14px;
                padding: 12px 20px;
            }
        }

        @media (max-width: 400px) {
            .profile-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- ==========================================================
    PROFILE SECTION
    ========================================================== -->
    <div class="profile-section">
        <div class="profile-card">

            <!-- Header -->
            <div class="profile-header">
                <div class="profile-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="profile-info">
                    <h2 id="profileName">—</h2>
                    <p class="email" id="profileEmail">—</p>
                    <div id="profileBadge" class="member-badge free">
                        🆓 Free Member
                    </div>
                </div>
            </div>

            <!-- Info Grid -->
            <div class="profile-grid">
                <div class="info-card">
                    <h4>Role</h4>
                    <p id="profileRole">—</p>
                </div>
                <div class="info-card">
                    <h4>Membership</h4>
                    <p id="profileMembership">—</p>
                </div>
                <div class="info-card">
                    <h4>Payment Status</h4>
                    <p id="profilePayment">—</p>
                </div>
                <div class="info-card">
                    <h4>Joined</h4>
                    <p id="profileJoined">—</p>
                </div>
            </div>

            <!-- Actions -->
            <div class="profile-actions">
                <button id="upgradeBtn" class="upgrade-btn">
                    <i class="fa-solid fa-arrow-up"></i> Upgrade Membership
                </button>
                <button id="logoutBtn" class="logout-btn">
                    <i class="fa-solid fa-sign-out-alt"></i> Sign Out
                </button>
            </div>

        </div>
    </div>

    <!-- Toast -->
    <div id="gtradesToast" class="gtrades-toast"></div>

    <!-- ==========================================================
    FIREBASE MODULE SCRIPT
    ========================================================== -->
    <script type="module">
        // ----------------------------------------------------------
        // 1. IMPORTS (adjust the path to your firebase.js)
        // ----------------------------------------------------------
        import { auth, db } from "../firebase.js";

        import {
            doc,
            getDoc,
            onSnapshot,
            updateDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

        // ----------------------------------------------------------
        // 2. DOM REFS
        // ----------------------------------------------------------
        const profileName = document.getElementById('profileName');
        const profileEmail = document.getElementById('profileEmail');
        const profileBadge = document.getElementById('profileBadge');
        const profileRole = document.getElementById('profileRole');
        const profileMembership = document.getElementById('profileMembership');
        const profilePayment = document.getElementById('profilePayment');
        const profileJoined = document.getElementById('profileJoined');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const toast = document.getElementById('gtradesToast');

        // ----------------------------------------------------------
        // 3. HELPERS
        // ----------------------------------------------------------
        function notify(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            try {
                if (timestamp.seconds) {
                    return new Date(timestamp.seconds * 1000).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }
                return new Date(timestamp).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch {
                return 'N/A';
            }
        }

        // ----------------------------------------------------------
        // 4. UPDATE UI
        // ----------------------------------------------------------
        function updateProfileUI(data) {
            // Name
            profileName.textContent = data.name || 'Trader';

            // Email
            profileEmail.textContent = data.email || 'email@example.com';

            // Role
            profileRole.textContent = data.role || 'member';

            // Membership
            profileMembership.textContent = data.membership || 'free';

            // Payment Status
            const isActive = data.active === true;
            profilePayment.textContent = isActive ? '✅ Active' : '⏳ Pending';
            profilePayment.className = isActive ? 'paid' : 'unpaid';

            // Joined
            profileJoined.textContent = formatDate(data.createdAt);

            // Badge
            const membership = data.membership || 'free';
            const role = data.role || 'member';
            profileBadge.classList.remove('free', 'premium', 'admin');

            if (role === 'admin') {
                profileBadge.classList.add('admin');
                profileBadge.textContent = '🛠️ Admin';
            } else if (membership === 'premium') {
                profileBadge.classList.add('premium');
                profileBadge.textContent = '⭐ Premium Member';
            } else {
                profileBadge.classList.add('free');
                profileBadge.textContent = '🆓 Free Member';
            }

            // Show/hide upgrade button
            if (membership === 'premium' || role === 'admin') {
                upgradeBtn.classList.add('hidden');
            } else {
                upgradeBtn.classList.remove('hidden');
            }
        }

        // ----------------------------------------------------------
        // 5. LOAD & LISTEN
        // ----------------------------------------------------------
        let currentUid = null;

        async function loadProfile(uid) {
            try {
                const userRef = doc(db, 'users', uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    notify('❌ User profile not found.');
                    return;
                }

                const data = userSnap.data();
                updateProfileUI(data);
                currentUid = uid;
            } catch (error) {
                console.error('Load error:', error);
                notify('❌ Failed to load profile.');
            }
        }

        function listenForProfileUpdates(uid) {
            const userRef = doc(db, 'users', uid);
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    updateProfileUI(docSnap.data());
                }
            }, (error) => {
                console.error('Listener error:', error);
                notify('⚠️ Real-time updates failed.');
            });
        }

        // ----------------------------------------------------------
        // 6. UPGRADE BUTTON
        // ----------------------------------------------------------
        upgradeBtn.addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) {
                notify('⚠️ Please sign in again.');
                return;
            }

            if (!confirm('Upgrade to Premium for $9.99/month?')) return;

            try {
                const userRef = doc(db, 'users', user.uid);
                await updateDoc(userRef, {
                    membership: 'premium',
                    active: true,
                    upgradedAt: serverTimestamp()
                });
                notify('✅ You are now a Premium Member!');
                // The real-time listener will update the UI automatically.
            } catch (error) {
                console.error('Upgrade error:', error);
                notify('❌ Upgrade failed. Please try again.');
            }
        });

        // ----------------------------------------------------------
        // 7. LOGOUT BUTTON
        // ----------------------------------------------------------
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Logout error:', error);
                notify('❌ Logout failed.');
            }
        });

        // ----------------------------------------------------------
        // 8. AUTH STATE
        // ----------------------------------------------------------
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            loadProfile(user.uid);
            listenForProfileUpdates(user.uid);
        });

        // ----------------------------------------------------------
        // 9. INIT LOG
        // ----------------------------------------------------------
        console.log('✅ GTRADES-AXIS™ Profile V2 loaded (real data)');
    </script>

</body>
</html>
