<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | GTRADES-AXIS™</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0a0e17;
    }
    .auth-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      text-align: center;
    }
    .auth-card h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 8px;
    }
    .auth-card h1 span {
      background: linear-gradient(135deg, #0f8cff, #00c853);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-card p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    .input-group i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1rem;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #e2e8f0;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      outline: none;
    }
    .input-group input:focus {
      border-color: #0f8cff;
      background: rgba(15,140,255,0.06);
      box-shadow: 0 0 0 3px rgba(15,140,255,0.1);
    }
    .input-group input::placeholder {
      color: #475569;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0f8cff, #0077e6);
      color: #fff;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(15,140,255,0.35);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .links {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .links a {
      color: #0f8cff;
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .msg.success {
      background: rgba(0,200,83,0.15);
      border: 1px solid rgba(0,200,83,0.25);
      color: #00c853;
      display: block;
    }
    .msg.error {
      background: rgba(255,77,79,0.15);
      border: 1px solid rgba(255,77,79,0.25);
      color: #ff4d4f;
      display: block;
    }
    .back-link {
      display: block;
      margin-top: 12px;
      color: #64748b;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .back-link:hover {
      color: #94a3b8;
    }
    @media (max-width:480px) {
      .auth-card { padding: 32px 20px; }
    }
  </style>
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Forgot <span>Password</span></h1>
      <p>Enter your email and we’ll send you a link to reset your password.</p>

      <div id="msg" class="msg"></div>

      <form id="resetForm">
        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input type="email" id="email" placeholder="Email Address" required>
        </div>
        <button type="submit" class="btn btn-primary" id="resetBtn">
          <i class="fa-solid fa-paper-plane"></i> Send Reset Link
        </button>
      </form>

      <div class="links">
        <a href="/login">← Back to Login</a>
      </div>
      <div class="login-links">
  <a href="/forgot-password">Forgot Password?</a>
</div>
      <a href="/" class="back-link">← Back to Home</a>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

    const form = document.getElementById('resetForm');
    const emailInput = document.getElementById('email');
    const resetBtn = document.getElementById('resetBtn');
    const msgEl = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if (!email) {
        showMsg('Please enter your email address.', 'error');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

      try {
        await sendPasswordResetEmail(auth, email);
        showMsg('✅ Password reset link sent! Check your email (including spam).', 'success');
        emailInput.value = '';
      } catch (error) {
        console.error('Reset error:', error);
        let msg = 'Something went wrong. Please try again.';
        if (error.code === 'auth/user-not-found') {
          msg = 'No account found with this email.';
        } else if (error.code === 'auth/invalid-email') {
          msg = 'Invalid email address.';
        } else if (error.code === 'auth/too-many-requests') {
          msg = 'Too many requests. Please wait and try again later.';
        }
        showMsg('❌ ' + msg, 'error');
      } finally {
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Reset Link';
      }
    });

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = 'msg ' + type;
    }
  </script>
    <script src="/js/responsive.js" defer></script>
</body>
</html>
