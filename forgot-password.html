<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | GTRADES-AXIS™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <!-- Reuse the same login.css for consistency (or include inline styles below) -->
    <link rel="stylesheet" href="css/login.css" />
    <style>
        /* Additional overrides specific to this page – or just add to login.css */
        .back-login {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            font-weight: 500;
            color: #6c63ff;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-login:hover {
            color: #4a42c4;
        }

        .reset-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #6c63ff, #4a42c4);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.35);
        }
        .reset-btn:active {
            transform: scale(0.97);
        }

        .msg {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 0.95rem;
            display: none;
        }
        .msg.success {
            display: block;
            background: #e6f7e6;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }
        .msg.error {
            display: block;
            background: #fde8e8;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .subtitle {
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <!-- Logo -->
            <div class="logo-wrapper">
                <img
                    src="images/imageslogo.png.png"
                    alt="GTRADES-AXIS Logo"
                    class="login-logo"
                    draggable="false"
                />
            </div>

            <h1>Forgot <span class="gradient-text">Password?</span></h1>
            <p class="subtitle">Enter your email and we’ll send you a password reset link.</p>

            <!-- Message area for success/error -->
            <div id="resetMsg" class="msg"></div>

            <form id="resetForm">
                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="Email Address"
                        required
                    />
                </div>

                <button type="submit" class="reset-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Send Reset Link</span>
                </button>
            </form>

            <!-- Back to Login -->
            <a href="login.html" class="back-login">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>

            <!-- Optional: keep the "secure access" divider if you like -->
            <!-- <div class="divider"> ... </div> -->
        </div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('resetForm');
            const emailInput = document.getElementById('resetEmail');
            const msgDiv = document.getElementById('resetMsg');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const email = emailInput.value.trim();

                // Basic validation
                if (!email) {
                    showMessage('Please enter your email address.', 'error');
                    return;
                }
                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address.', 'error');
                    return;
                }

                // Simulate sending request (replace with actual fetch/API call)
                showMessage('Sending reset link...', 'info'); // optional

                // Example: send to your backend
                // fetch('/api/forgot-password', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({ email })
                // })
                // .then(res => res.json())
                // .then(data => {
                //     if (data.success) {
                //         showMessage('Reset link sent! Check your inbox.', 'success');
                //     } else {
                //         showMessage(data.message || 'Something went wrong.', 'error');
                //     }
                // })
                // .catch(() => showMessage('Network error. Please try again.', 'error'));

                // For demo, just show success
                showMessage('Reset link sent! Check your inbox.', 'success');
                emailInput.value = ''; // clear field
            });

            function showMessage(text, type) {
                msgDiv.textContent = text;
                msgDiv.className = 'msg ' + type;
                msgDiv.style.display = 'block';
                // Auto-hide after 5 seconds for success?
                if (type === 'success') {
                    setTimeout(() => {
                        msgDiv.style.display = 'none';
                    }, 5000);
                }
            }

            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }
        })();
    </script>

</body>
</html>
