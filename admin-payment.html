<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTRADES-AXIS™ · Admin Payments</title>

    <!-- Firebase SDK via import map -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
            }
        }
    </script>

    <!-- Font Awesome & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ==========================================================
           GTRADES-AXIS™ · ADMIN PAYMENTS · COMPLETE STYLES
           ========================================================== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0d15;
            --bg-secondary: #12141f;
            --bg-card: #1a1d2e;
            --bg-card-hover: #22263b;
            --border-color: #2a2f45;
            --text-primary: #f0f2fa;
            --text-secondary: #9aa1b9;
            --text-muted: #6a7188;
            --gold: #f5b342;
            --gold-dim: rgba(245, 179, 66, 0.12);
            --green: #3dd68c;
            --green-dim: rgba(61, 214, 140, 0.12);
            --red: #f25a6a;
            --red-dim: rgba(242, 90, 106, 0.12);
            --blue: #4b7bec;
            --blue-dim: rgba(75, 123, 236, 0.12);
            --radius: 12px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --transition: 0.2s ease;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* ----- SIDEBAR ----- */
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            padding: 28px 20px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--gold);
            margin-bottom: 36px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-brand i {
            font-size: 1.5rem;
            color: var(--gold);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius);
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        .sidebar-nav a i {
            width: 20px;
            text-align: center;
        }
        .sidebar-nav a:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .sidebar-nav a.active {
            background: var(--gold-dim);
            color: var(--gold);
            font-weight: 600;
        }
        .sidebar-nav a.active i {
            color: var(--gold);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .sidebar-footer .admin-badge {
            display: inline-block;
            background: var(--gold-dim);
            color: var(--gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 6px;
        }

        /* ----- MAIN CONTENT ----- */
        .main {
            flex: 1;
            padding: 32px 40px 60px;
            max-width: calc(100% - 260px);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-header h1 i {
            color: var(--gold);
            font-size: 1.5rem;
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-actions .refresh-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions .refresh-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        /* ----- STATS ROW ----- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 20px;
            transition: var(--transition);
        }
        .stat-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-muted);
        }
        .stat-card .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-card .value.pending {
            color: var(--gold);
        }
        .stat-card .value.approved {
            color: var(--green);
        }
        .stat-card .value.rejected {
            color: var(--red);
        }

        /* ----- FILTER & SEARCH ----- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }
        .toolbar .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0 14px;
            transition: var(--transition);
        }
        .toolbar .search-box:focus-within {
            border-color: var(--gold);
        }
        .toolbar .search-box i {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .toolbar .search-box input {
            background: transparent;
            border: none;
            padding: 10px 10px 10px 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }
        .toolbar .search-box input::placeholder {
            color: var(--text-muted);
        }
        .toolbar .filter-box select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .toolbar .filter-box select:focus {
            border-color: var(--gold);
        }

        /* ----- TABLE WRAPPER ----- */
        .table-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 700px;
        }

        thead {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        thead th {
            text-align: left;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }
        tbody tr:last-child {
            border-bottom: none;
        }
        tbody tr:hover {
            background: var(--bg-card-hover);
        }

        tbody td {
            padding: 14px 18px;
            vertical-align: middle;
            color: var(--text-secondary);
            word-break: break-word;
        }
        tbody td:first-child {
            font-weight: 500;
            color: var(--text-primary);
        }

        /* ----- STATUS BADGE ----- */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: capitalize;
            letter-spacing: 0.02em;
            background: var(--bg-secondary);
            color: var(--text-muted);
            border: 1px solid transparent;
        }
        .status.pending {
            background: var(--gold-dim);
            color: var(--gold);
            border-color: rgba(245, 179, 66, 0.2);
        }
        .status.approved {
            background: var(--green-dim);
            color: var(--green);
            border-color: rgba(61, 214, 140, 0.2);
        }
        .status.rejected {
            background: var(--red-dim);
            color: var(--red);
            border-color: rgba(242, 90, 106, 0.2);
        }

        /* ----- ACTION BUTTONS ----- */
        .action-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .action-group button {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .action-group .approve-btn {
            background: var(--green);
            color: #0b0d15;
        }
        .action-group .approve-btn:hover {
            background: #4de0a0;
            transform: scale(1.02);
        }
        .action-group .reject-btn {
            background: var(--red);
            color: #0b0d15;
        }
        .action-group .reject-btn:hover {
            background: #f57382;
            transform: scale(1.02);
        }
        .action-group .completed-label {
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
        }

        .proof-link {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
            border-bottom: 1px dotted var(--blue-dim);
            transition: var(--transition);
        }
        .proof-link:hover {
            color: #6b8ff5;
            border-bottom-color: var(--blue);
        }
        .proof-link i {
            font-size: 0.7rem;
            margin-left: 4px;
        }

        /* ----- EMPTY STATE ----- */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 2.5rem;
            color: var(--border-color);
            margin-bottom: 12px;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
                padding: 20px 12px;
            }
            .sidebar-brand span {
                display: none;
            }
            .sidebar-nav a span {
                display: none;
            }
            .sidebar-nav a {
                justify-content: center;
                padding: 14px;
            }
            .sidebar-nav a i {
                font-size: 1.2rem;
                margin: 0;
            }
            .sidebar-footer {
                text-align: center;
            }
            .main {
                max-width: calc(100% - 80px);
                padding: 24px 20px 40px;
            }
        }

        @media (max-width: 640px) {
            .sidebar {
                width: 60px;
                padding: 16px 8px;
            }
            .main {
                max-width: calc(100% - 60px);
                padding: 16px 12px 32px;
            }
            .page-header h1 {
                font-size: 1.3rem;
            }
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }
            .header-actions .refresh-btn span {
                display: none;
            }
            table {
                font-size: 0.75rem;
                min-width: 600px;
            }
            thead th,
            tbody td {
                padding: 10px 12px;
            }
            .action-group button {
                padding: 4px 12px;
                font-size: 0.65rem;
            }
        }

        @media (max-width: 480px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
        }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- ==========================================================
    SIDEBAR
    ========================================================== -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-chart-line"></i>
            <span>GTRADES·AXIS</span>
        </div>
        <nav class="sidebar-nav">
            <a href="#"><i class="fas fa-home"></i><span>Dashboard</span></a>
            <a href="#" class="active"><i class="fas fa-credit-card"></i><span>Payments</span></a>
            <a href="#"><i class="fas fa-users"></i><span>Users</span></a>
            <a href="#"><i class="fas fa-clipboard-list"></i><span>Audit Logs</span></a>
            <a href="#"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="admin-badge"><i class="fas fa-shield-alt"></i> Admin</div>
            <div style="margin-top:8px;font-size:0.7rem;">
                <i class="fas fa-circle" style="color:var(--green);font-size:0.5rem;"></i> Live
            </div>
        </div>
    </aside>

    <!-- ==========================================================
    MAIN CONTENT
    ========================================================== -->
    <main class="main">

        <!-- PAGE HEADER -->
        <div class="page-header">
            <div>
                <h1><i class="fas fa-credit-card"></i> Payment Requests</h1>
                <div class="subtitle">Review and manage all user payment submissions</div>
            </div>
            <div class="header-actions">
                <button class="refresh-btn" onclick="location.reload()">
                    <i class="fas fa-sync-alt"></i> <span>Refresh</span>
                </button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="label">Pending</div>
                <div class="value pending" id="statPending">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Approved</div>
                <div class="value approved" id="statApproved">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Rejected</div>
                <div class="value rejected" id="statRejected">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total</div>
                <div class="value" id="statTotal">0</div>
            </div>
        </div>

        <!-- TOOLBAR: SEARCH + FILTER -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="paymentSearch" placeholder="Search by name or email..." />
            </div>
            <div class="filter-box">
                <select id="paymentFilter">
                    <option value="all">All status</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-wrapper">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Plan</th>
                            <th>Status</th>
                            <th>Method</th>
                            <th>Proof</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsTable">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ==========================================================
    FIREBASE CONFIG + INIT + COMPLETE APP SCRIPT
    ========================================================== -->
    <script type="module">
        // ------------------------------------------------------------------
        // IMPORT FIREBASE
        // ------------------------------------------------------------------
        import { initializeApp } from "firebase/app";
        import {
            getAuth,
            onAuthStateChanged
        } from "firebase/auth";
        import {
            getFirestore,
            collection,
            query,
            where,
            orderBy,
            onSnapshot,
            doc,
            getDoc,
            updateDoc,
            addDoc,
            serverTimestamp,
            getDocs,
            limit
        } from "firebase/firestore";

        // ------------------------------------------------------------------
        // YOUR FIREBASE CONFIG — REPLACE WITH YOUR OWN
        // ------------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDummyReplaceWithYourActualKey",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        // ------------------------------------------------------------------
        // INIT
        // ------------------------------------------------------------------
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log("🔥 Firebase initialized");

        // ==========================================================
        // ELEMENTS
        // ==========================================================
        const paymentsTable = document.getElementById('paymentsTable');
        const statPending = document.getElementById('statPending');
        const statApproved = document.getElementById('statApproved');
        const statRejected = document.getElementById('statRejected');
        const statTotal = document.getElementById('statTotal');
        const searchInput = document.getElementById('paymentSearch');
        const statusFilter = document.getElementById('paymentFilter');

        let allPayments = []; // holds all payment data for filtering

        // ==========================================================
        // ADMIN AUTH CHECK
        // ==========================================================
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }

            const adminRef = doc(db, 'users', user.uid);
            const adminSnap = await getDoc(adminRef);
            if (!adminSnap.exists() || adminSnap.data().role !== 'admin') {
                alert('Unauthorized access');
                window.location.href = '../index.html';
                return;
            }

            console.log('Admin verified:', user.email);
            loadPayments();
        });

        // ==========================================================
        // LOAD PAYMENTS (REAL-TIME)
        // ==========================================================
        function loadPayments() {
            const paymentsRef = collection(db, 'payments');
            const q = query(paymentsRef, orderBy('createdAt', 'desc'));

            onSnapshot(q, (snapshot) => {
                allPayments = [];
                let pending = 0,
                    approved = 0,
                    rejected = 0,
                    total = 0;

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const payment = { id: docSnap.id, ...data };
                    allPayments.push(payment);
                    total++;
                    if (data.status === 'pending') pending++;
                    else if (data.status === 'approved') approved++;
                    else if (data.status === 'rejected') rejected++;
                });

                // Update stats
                if (statPending) statPending.innerText = pending;
                if (statApproved) statApproved.innerText = approved;
                if (statRejected) statRejected.innerText = rejected;
                if (statTotal) statTotal.innerText = total;

                // Apply current filter/search
                filterPayments();
            }, (error) => {
                console.error('Payment listener error:', error);
            });
        }

        // ==========================================================
        // FILTER + SEARCH
        // ==========================================================
        function filterPayments() {
            let filtered = [...allPayments];
            const search = searchInput?.value.toLowerCase().trim() || '';
            const status = statusFilter?.value || 'all';

            if (search) {
                filtered = filtered.filter(p =>
                    (p.name?.toLowerCase().includes(search) ||
                        p.email?.toLowerCase().includes(search))
                );
            }
            if (status !== 'all') {
                filtered = filtered.filter(p => p.status === status);
            }

            renderPayments(filtered);
        }

        searchInput?.addEventListener('input', filterPayments);
        statusFilter?.addEventListener('change', filterPayments);

        // ==========================================================
        // RENDER PAYMENT TABLE
        // ==========================================================
        function renderPayments(data) {
            if (!paymentsTable) return;
            if (!data || data.length === 0) {
                paymentsTable.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No payments to display</p>
                        </td>
                    </tr>
                `;
                return;
            }

            paymentsTable.innerHTML = '';
            data.forEach((payment) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${payment.name || 'N/A'}</td>
                    <td>${payment.email || 'N/A'}</td>
                    <td>${payment.plan || 'N/A'}</td>
                    <td><span class="status ${payment.status}">${payment.status}</span></td>
                    <td>${payment.paymentMethod || 'N/A'}</td>
                    <td>
                        ${payment.paymentProof
                            ? `<a href="${payment.paymentProof}" target="_blank" class="proof-link">Proof <i class="fas fa-external-link-alt"></i></a>`
                            : '<span class="no-proof">No proof</span>'}
                    </td>
                    <td>
                        ${payment.status === 'pending'
                            ? `
                                <div class="action-group">
                                    <button class="approve-btn" data-id="${payment.id}" data-user="${payment.userId || ''}">
                                        <i class="fas fa-check"></i> Approve
                                    </button>
                                    <button class="reject-btn" data-id="${payment.id}">
                                        <i class="fas fa-times"></i> Reject
                                    </button>
                                </div>
                            `
                            : '<span class="completed-label">Completed</span>'}
                    </td>
                `;
                paymentsTable.appendChild(row);
            });
        }

        // ==========================================================
        // PAYMENT ACTIONS (APPROVE / REJECT) via delegation
        // ==========================================================
        document.addEventListener('click', async (e) => {
            // ----- APPROVE -----
            if (e.target.closest('.approve-btn')) {
                const btn = e.target.closest('.approve-btn');
                const paymentId = btn.dataset.id;
                const userId = btn.dataset.user;

                if (!confirm('Approve this payment?')) return;

                try {
                    const paymentRef = doc(db, 'payments', paymentId);
                    const paymentSnap = await getDoc(paymentRef);
                    if (paymentSnap.exists() && paymentSnap.data().status === 'approved') {
                        alert('This payment is already approved.');
                        return;
                    }

                    await updateDoc(paymentRef, {
                        status: 'approved',
                        approvedAt: serverTimestamp()
                    });

                    // Upgrade user to premium
                    if (userId) {
                        const userRef = doc(db, 'users', userId);
                        const userSnap = await getDoc(userRef);
                        if (userSnap.exists()) {
                            await updateDoc(userRef, {
                                membership: 'premium',
                                status: 'active',
                                role: 'member'
                            });
                        }
                    }

                    // Audit log
                    await createPaymentLog('APPROVED', paymentId, userId, 'Payment approved and premium activated');

                    alert('Payment approved successfully.');
                } catch (err) {
                    console.error('Approval error:', err);
                    alert('Failed to approve payment.');
                }
            }

            // ----- REJECT -----
            if (e.target.closest('.reject-btn')) {
                const btn = e.target.closest('.reject-btn');
                const paymentId = btn.dataset.id;

                if (!confirm('Reject this payment?')) return;

                try {
                    const paymentRef = doc(db, 'payments', paymentId);
                    await updateDoc(paymentRef, {
                        status: 'rejected',
                        rejectedAt: serverTimestamp()
                    });

                    await createPaymentLog('REJECTED', paymentId, null, 'Payment rejected by admin');

                    alert('Payment rejected.');
                } catch (err) {
                    console.error('Reject error:', err);
                    alert('Failed to reject payment.');
                }
            }
        });

        // ==========================================================
        // AUDIT LOG FUNCTION
        // ==========================================================
        async function createPaymentLog(action, paymentId, userId, description) {
            try {
                await addDoc(collection(db, 'paymentLogs'), {
                    action: action,
                    paymentId: paymentId,
                    userId: userId || null,
                    description: description,
                    adminEmail: auth.currentUser?.email || 'unknown',
                    createdAt: serverTimestamp()
                });
                console.log('Audit log saved:', action);
            } catch (err) {
                console.error('Audit log error:', err);
            }
        }

        console.log('✅ Admin Payments Module Loaded');
    </script>
