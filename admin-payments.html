<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin - Payments | GTRADES-AXIS™
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Poppins, sans-serif;
      background: #0b0d15;
      color: #e8edf5;
      min-height: 100vh;
      padding: 20px;
    }

    .admin-container {
      max-width: 1400px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 28px;
    }

    .header h1 i {
      color: #4f7cff;
      margin-right: 10px;
    }

    .back {
      color: #4f7cff;
      text-decoration: none;
      font-weight: 600;
    }

    .stats-bar {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(150px, 1fr));

      gap: 16px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: #131724;
      border: 1px solid #2a3450;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .stat-card h2 {
      font-size: 28px;
      color: #4f7cff;
    }

    .stat-card p {
      color: #9aa4bf;
      font-size: 13px;
    }

    .stat-card.pending h2 {
      color: #f5a623;
    }

    .stat-card.approved h2 {
      color: #00c897;
    }

    .stat-card.rejected h2 {
      color: #ff4766;
    }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters input,
    .filters select {
      background: #131724;
      border: 1px solid #2a3450;
      color: #fff;
      padding: 11px 14px;
      border-radius: 8px;
      font-family: Poppins, sans-serif;
    }

    .filters input {
      min-width: 280px;
    }

    .payments-table {
      background: #131724;
      border: 1px solid #2a3450;
      border-radius: 12px;
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1200px;
      border-collapse: collapse;
    }

    thead {
      background: #0b0d15;
    }

    th {
      padding: 14px;
      text-align: left;
      color: #9aa4bf;
      font-size: 11px;
      text-transform: uppercase;
    }

    td {
      padding: 14px;
      border-top: 1px solid #2a3450;
      vertical-align: middle;
      font-size: 13px;
    }

    tbody tr:hover {
      background: #1a1f2f;
    }

    .status {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status.pending {
      background: rgba(245,166,35,.12);
      color: #f5a623;
    }

    .status.approved {
      background: rgba(0,200,151,.12);
      color: #00c897;
    }

    .status.rejected {
      background: rgba(255,71,102,.12);
      color: #ff4766;
    }

    .money-usd {
      color: #fff;
      font-weight: 700;
    }

    .money-kes {
      color: #00c897;
      font-weight: 700;
    }

    .rate {
      color: #9aa4bf;
      font-size: 11px;
    }

    .proof-btn {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 6px;
      background: rgba(79,124,255,.12);
      color: #4f7cff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
    }

    .proof-btn:hover {
      background: #4f7cff;
      color: white;
    }

    .action-buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .action-buttons button {
      border: none;
      border-radius: 6px;
      padding: 7px 13px;
      cursor: pointer;
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 11px;
    }

    .approve-btn {
      background: rgba(0,200,151,.12);
      color: #00c897;
    }

    .approve-btn:hover {
      background: #00c897;
      color: #fff;
    }

    .reject-btn {
      background: rgba(255,71,102,.12);
      color: #ff4766;
    }

    .reject-btn:hover {
      background: #ff4766;
      color: #fff;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 45px;
      color: #9aa4bf;
    }

    .loading i {
      color: #4f7cff;
      font-size: 25px;
    }

    @media (max-width: 700px) {

      .stats-bar {
        grid-template-columns: 1fr 1fr;
      }

      .filters input {
        min-width: 100%;
      }

    }

  </style>

</head>

<body>

<div class="admin-container">

  <div class="header">

    <h1>
      <i class="fa-solid fa-credit-card"></i>
      Payment Approvals
    </h1>

    <a
      href="admin.html"
      class="back"
    >
      <i class="fa-solid fa-arrow-left"></i>
      Back to Admin
    </a>

  </div>


  <div class="stats-bar">

    <div class="stat-card pending">
      <h2 id="statPending">0</h2>
      <p>Pending</p>
    </div>

    <div class="stat-card approved">
      <h2 id="statApproved">0</h2>
      <p>Approved</p>
    </div>

    <div class="stat-card rejected">
      <h2 id="statRejected">0</h2>
      <p>Rejected</p>
    </div>

    <div class="stat-card">
      <h2 id="statRevenue">$0</h2>
      <p>Approved Revenue</p>
    </div>

  </div>


  <div class="filters">

    <input
      type="search"
      id="paymentSearch"
      placeholder="Search name, email or transaction ID..."
    >

    <select id="paymentFilter">

      <option value="all">
        All Payments
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="approved">
        Approved
      </option>

      <option value="rejected">
        Rejected
      </option>

    </select>

  </div>


  <div class="payments-table">

    <div class="table-scroll">

      <table>

        <thead>

          <tr>

            <th>User</th>

            <th>Plan</th>

            <th>Method</th>

            <th>USD</th>

            <th>KES Paid</th>

            <th>Rate</th>

            <th>Transaction</th>

            <th>Proof</th>

            <th>Status</th>

            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="paymentsBody">

          <tr>

            <td colspan="10">

              <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <p>
                  Loading payments...
                </p>

              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<script type="importmap">
{
  "imports": {
    "firebase": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
  }
}
</script>


<script type="module">

import {
  auth,
  db
} from "./js/firebase.js";


import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";


import {
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp,
  addDoc
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";


// ============================================================
// DOM
// ============================================================

const tbody =
  document.getElementById(
    "paymentsBody"
  );

const statPending =
  document.getElementById(
    "statPending"
  );

const statApproved =
  document.getElementById(
    "statApproved"
  );

const statRejected =
  document.getElementById(
    "statRejected"
  );

const statRevenue =
  document.getElementById(
    "statRevenue"
  );

const searchInput =
  document.getElementById(
    "paymentSearch"
  );

const filterInput =
  document.getElementById(
    "paymentFilter"
  );


let allPayments = [];


// ============================================================
// ADMIN AUTH
// ============================================================

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    try {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnap =
        await getDoc(userRef);


      if (
        !userSnap.exists() ||
        userSnap.data().role !== "admin"
      ) {

        window.location.href =
          "access-denied.html";

        return;

      }


      console.log(
        "✅ Admin verified:",
        user.email
      );


      loadPayments();

    } catch (error) {

      console.error(
        "ADMIN CHECK ERROR:",
        error
      );

      window.location.href =
        "login.html";

    }

  }
);


// ============================================================
// LOAD PAYMENTS
// ============================================================

function loadPayments() {

  const q =
    query(

      collection(
        db,
        "payments"
      ),

      orderBy(
        "createdAt",
        "desc"
      )

    );


  onSnapshot(
    q,
    (snapshot) => {

      allPayments = [];


      snapshot.forEach(
        (paymentDoc) => {

          allPayments.push({

            id:
              paymentDoc.id,

            ...paymentDoc.data()

          });

        }
      );


      updateStats();

      filterAndRender();

    },
    (error) => {

      console.error(
        "PAYMENTS LISTENER ERROR:",
        error
      );


      tbody.innerHTML = `

        <tr>

          <td colspan="10">

            <div class="error">

              <i class="fa-solid fa-circle-exclamation"></i>

              <p>
                Error loading payments.
              </p>

              <small>
                ${escapeHTML(error.message)}
              </small>

            </div>

          </td>

        </tr>

      `;

    }
  );

}


// ============================================================
// STATISTICS
// ============================================================

function updateStats() {

  let pending = 0;

  let approved = 0;

  let rejected = 0;

  let revenue = 0;


  allPayments.forEach(
    (payment) => {

      if (
        payment.status ===
        "pending"
      ) {

        pending++;

      }


      if (
        payment.status ===
        "approved"
      ) {

        approved++;

        revenue +=
          Number(
            payment.amountUSD || 0
          );

      }


      if (
        payment.status ===
        "rejected"
      ) {

        rejected++;

      }

    }
  );


  statPending.textContent =
    pending;

  statApproved.textContent =
    approved;

  statRejected.textContent =
    rejected;

  statRevenue.textContent =
    `$${revenue.toFixed(2)}`;

}


// ============================================================
// SEARCH + FILTER
// ============================================================

searchInput.addEventListener(
  "input",
  filterAndRender
);


filterInput.addEventListener(
  "change",
  filterAndRender
);


function filterAndRender() {

  const search =
    searchInput.value
      .toLowerCase()
      .trim();


  const filter =
    filterInput.value;


  let filtered =
    allPayments.filter(
      (payment) => {

        const matchesSearch =
          !search ||

          String(
            payment.name || ""
          )
            .toLowerCase()
            .includes(search) ||

          String(
            payment.email || ""
          )
            .toLowerCase()
            .includes(search) ||

          String(
            payment.transactionId || ""
          )
            .toLowerCase()
            .includes(search);


        const matchesStatus =
          filter === "all" ||
          payment.status === filter;


        return (
          matchesSearch &&
          matchesStatus
        );

      }
    );


  renderPayments(
    filtered
  );

}


// ============================================================
// RENDER
// ============================================================

function renderPayments(
  payments
) {

  if (!payments.length) {

    tbody.innerHTML = `

      <tr>

        <td colspan="10">

          <div class="empty">

            <i class="fa-solid fa-inbox"></i>

            <p>
              No payments found.
            </p>

          </div>

        </td>

      </tr>

    `;

    return;

  }


  tbody.innerHTML =
    payments
      .map(renderPayment)
      .join("");


  document
    .querySelectorAll(".approve-btn")
    .forEach(
      (button) => {

        button.addEventListener(
          "click",
          () => {

            handlePayment(
              button.dataset.id,
              "approved"
            );

          }
        );

      }
    );


  document
    .querySelectorAll(".reject-btn")
    .forEach(
      (button) => {

        button.addEventListener(
          "click",
          () => {

            handlePayment(
              button.dataset.id,
              "rejected"
            );

          }
        );

      }
    );

}


// ============================================================
// PAYMENT ROW
// ============================================================

function renderPayment(
  payment
) {

  const status =
    payment.status ||
    "pending";


  const usd =
    Number(
      payment.amountUSD || 0
    );


  const kes =
    payment.amountKES;


  const rate =
    payment.exchangeRate;


  const proof =
    payment.proofURL ||
    "";


  const actions =
    status === "pending"

      ? `

        <div class="action-buttons">

          <button
            class="approve-btn"
            data-id="${payment.id}"
          >
            <i class="fa-solid fa-check"></i>
            Approve
          </button>

          <button
            class="reject-btn"
            data-id="${payment.id}"
          >
            <i class="fa-solid fa-xmark"></i>
            Reject
          </button>

        </div>

      `

      : "—";


  const transaction =
    escapeHTML(
      payment.transactionId ||
      "—"
    );


  return `

    <tr>

      <td>

        <strong>
          ${escapeHTML(
            payment.name ||
            "N/A"
          )}
        </strong>

        <br>

        <small style="color:#9aa4bf;">
          ${escapeHTML(
            payment.email ||
            ""
          )}
        </small>

      </td>


      <td>
        ${escapeHTML(
          payment.plan ||
          "—"
        )}
      </td>


      <td>
        ${
          payment.paymentMethod ===
          "Mpesa"
            ? "M-PESA"
            : "PayPal"
        }
      </td>


      <td>

        <span class="money-usd">
          $${usd.toFixed(2)}
        </span>

      </td>


      <td>

        ${
          kes !== null &&
          kes !== undefined
            ? `
              <span class="money-kes">
                KSh ${Number(kes).toLocaleString("en-KE")}
              </span>
            `
            : "—"
        }

      </td>


      <td>

        ${
          rate
            ? `
              <span class="rate">
                1 USD =
                KSh ${Number(rate).toFixed(4)}
              </span>
            `
            : "—"
        }

      </td>


      <td>

        <code>
          ${transaction}
        </code>

      </td>


      <td>

        ${
          proof
            ? `
              <a
                href="${escapeAttribute(proof)}"
                target="_blank"
                rel="noopener noreferrer"
                class="proof-btn"
              >
                <i class="fa-solid fa-eye"></i>
                View
              </a>
            `
            : "—"
        }

      </td>


      <td>

        <span
          class="status ${status}"
        >
          ${escapeHTML(status)}
        </span>

      </td>


      <td>

        ${actions}

      </td>

    </tr>

  `;

}


// ============================================================
// APPROVE / REJECT
// ============================================================

async function handlePayment(
  paymentId,
  newStatus
) {

  const payment =
    allPayments.find(
      (item) =>
        item.id === paymentId
    );


  if (!payment) {

    alert(
      "Payment could not be found."
    );

    return;

  }


  if (
    payment.status !==
    "pending"
  ) {

    alert(
      "This payment has already been processed."
    );

    return;

  }


  const action =
    newStatus === "approved"
      ? "approve"
      : "reject";


  const confirmed =
    confirm(
      `Are you sure you want to ${action} this payment?`
    );


  if (!confirmed) {

    return;

  }


  try {

    // --------------------------------------------------------
    // UPDATE PAYMENT
    // --------------------------------------------------------

    await updateDoc(

      doc(
        db,
        "payments",
        paymentId
      ),

      {

        status:
          newStatus,

        reviewedAt:
          serverTimestamp(),

        reviewedBy:
          auth.currentUser.uid

      }

    );


    // --------------------------------------------------------
    // APPROVE USER
    // --------------------------------------------------------

    if (
      newStatus ===
      "approved"
    ) {

      if (!payment.userId) {

        throw new Error(
          "Payment has no userId."
        );

      }


      const userRef =
        doc(
          db,
          "users",
          payment.userId
        );


      const userSnap =
        await getDoc(
          userRef
        );


      if (!userSnap.exists()) {

        throw new Error(
          "User account was not found."
        );

      }


      await updateDoc(
        userRef,
        {

          membership:
            "premium",

          status:
            "active",

          role:
            "member",

          updatedAt:
            serverTimestamp()

        }
      );


      // ------------------------------------------------------
      // AUDIT LOG
      // ------------------------------------------------------

      await addDoc(

        collection(
          db,
          "paymentLogs"
        ),

        {

          action:
            "APPROVED",

          paymentId,

          userId:
            payment.userId,

          details:
            "Payment approved and Premium membership activated.",

          admin:
            auth.currentUser.email,

          createdAt:
            serverTimestamp()

        }

      );


      alert(
        "✅ Payment approved. User is now Premium."
      );

    }


    // --------------------------------------------------------
    // REJECT
    // --------------------------------------------------------

    if (
      newStatus ===
      "rejected"
    ) {

      await addDoc(

        collection(
          db,
          "paymentLogs"
        ),

        {

          action:
            "REJECTED",

          paymentId,

          userId:
            payment.userId || null,

          details:
            "Payment rejected by administrator.",

          admin:
            auth.currentUser.email,

          createdAt:
            serverTimestamp()

        }

      );


      alert(
        "❌ Payment rejected."
      );

    }

  } catch (error) {

    console.error(
      "PAYMENT ACTION ERROR:",
      error
    );


    alert(
      error?.message ||
      "Failed to process payment."
    );

  }

}


// ============================================================
// SECURITY HELPERS
// ============================================================

function escapeHTML(
  value
) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(
  value
) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");

}


console.log(
  "✅ Admin Payments System Loaded"
);

</script>

</body>
</html>
