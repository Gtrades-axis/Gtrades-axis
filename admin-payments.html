<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Payments | GTRADES-AXIS™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0b0d15;
      color: #e8edf5;
      min-height: 100vh;
      padding: 20px;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
    }
    .header h1 i { color: #4f7cff; margin-right: 10px; }
    .header .back {
      color: #1d9bf0;
      text-decoration: none;
      font-weight: 500;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #131724;
      border: 1px solid #2a3450;
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
    }
    .stat-card h2 { font-size: 28px; font-weight: 700; color: #4f7cff; }
    .stat-card p { color: #9aa4bf; font-size: 13px; }
    .stat-card.pending h2 { color: #f5a623; }
    .stat-card.approved h2 { color: #00c897; }
    .stat-card.rejected h2 { color: #ff4766; }

    .payments-table {
      background: #131724;
      border: 1px solid #2a3450;
      border-radius: 12px;
      overflow: hidden;
    }
    .table-scroll { overflow-x: auto; padding: 4px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 900px;
    }
    thead {
      background: #0b0d15;
      border-bottom: 2px solid #2a3450;
    }
    thead th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9aa4bf;
    }
    tbody tr {
      border-bottom: 1px solid #2a3450;
      transition: 0.2s;
    }
    tbody tr:hover { background: #1a1f2f; }
    tbody td {
      padding: 12px 16px;
      vertical-align: middle;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-badge.pending {
      background: rgba(245,166,35,0.12);
      color: #f5a623;
    }
    .status-badge.approved {
      background: rgba(0,200,151,0.12);
      color: #00c897;
    }
    .status-badge.rejected {
      background: rgba(255,71,102,0.12);
      color: #ff4766;
    }
    .action-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .action-btns button {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: 0.25s;
      font-family: 'Poppins', sans-serif;
    }
    .btn-approve {
      background: rgba(0,200,151,0.12);
      color: #00c897;
    }
    .btn-approve:hover {
      background: #00c897;
      color: #fff;
    }
    .btn-reject {
      background: rgba(255,71,102,0.12);
      color: #ff4766;
    }
    .btn-reject:hover {
      background: #ff4766;
      color: #fff;
    }
    .btn-view-proof {
      background: rgba(79,124,255,0.12);
      color: #4f7cff;
      padding: 4px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
    }
    .btn-view-proof:hover {
      background: #4f7cff;
      color: #fff;
    }
    .no-payments {
      text-align: center;
      padding: 40px;
      color: #9aa4bf;
    }
    .no-payments i { font-size: 2rem; display: block; margin-bottom: 12px; }
    .loading-spinner {
      text-align: center;
      padding: 40px;
    }
    .loading-spinner i { font-size: 2rem; color: #4f7cff; }

    @media (max-width: 768px) {
      .header { flex-direction: column; align-items: stretch; }
      .stats-bar { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="admin-container">
  <div class="header">
    <h1><i class="fa-solid fa-credit-card"></i> Payment Approvals</h1>
    <a href="admin.html" class="back"><i class="fa-solid fa-arrow-left"></i> Back to Admin</a>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card pending">
      <h2 id="statPending">0</h2>
      <p>Pending</p>
    </div>
    <div class="stat-card approved">
      <h2 id="statApproved">0</h2>
      <p>Approved</p>
    </div>
    <div class="stat-card rejected">
      <h2 id="statRejected">0</h2>
      <p>Rejected</p>
    </div>
    <div class="stat-card">
      <h2 id="statTotal">0</h2>
      <p>Total</p>
    </div>
  </div>

  <!-- Table -->
  <div class="payments-table">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Plan</th>
            <th>Method</th>
            <th>Transaction ID</th>
            <th>Amount</th>
            <th>Proof</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="paymentsBody">
          <tr><td colspan="8"><div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading payments...</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "firebase": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
  }
}
</script>

<script type="module">
  // ─── IMPORTS (ALL AT THE TOP) ─────────────────────────────
  import { auth, db } from "./js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
  import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp,
    orderBy,
  } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

  // ─── DOM REFS ──────────────────────────────────────────────
  const tbody = document.getElementById("paymentsBody");
  const statPending = document.getElementById("statPending");
  const statApproved = document.getElementById("statApproved");
  const statRejected = document.getElementById("statRejected");
  const statTotal = document.getElementById("statTotal");

  let allPayments = [];

  // ─── AUTH GUARD (admin only) ─────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (!userDoc.exists() || userDoc.data().role !== "admin") {
        window.location.href = "access-denied.html";
        return;
      }
      // Admin verified – start listening
      listenPayments();
    } catch (e) {
      console.error(e);
      window.location.href = "login.html";
    }
  });

  // ─── REAL-TIME LISTENER ──────────────────────────────────
  function listenPayments() {
    const q = query(
      collection(db, "payments"),
      orderBy("createdAt", "desc")
    );

    onSnapshot(q, (snapshot) => {
      allPayments = [];
      snapshot.forEach((doc) => {
        allPayments.push({ id: doc.id, ...doc.data() });
      });
      renderTable(allPayments);
      updateStats(allPayments);
    }, (error) => {
      console.error("Listener error:", error);
      tbody.innerHTML = `<tr><td colspan="8"><div class="no-payments"><i class="fa-solid fa-circle-exclamation"></i> Error loading payments.</div></td></tr>`;
    });
  }

  // ─── RENDER TABLE ──────────────────────────────────────────
  function renderTable(payments) {
    if (payments.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="no-payments"><i class="fa-solid fa-inbox"></i> No payments yet.</div></td></tr>`;
      return;
    }

    let html = "";
    payments.forEach((p) => {
      const statusClass = p.status || "pending";
      const statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
      const proofLink = p.proofURL ? `<a href="${p.proofURL}" target="_blank" class="btn-view-proof">View</a>` : "—";

      html += `
        <tr>
          <td><strong>${p.name || "—"}</strong><br><small style="color:#9aa4bf;">${p.email || ""}</small></td>
          <td>${p.plan || "—"}</td>
          <td>${p.paymentMethod || "—"}</td>
          <td><code style="font-size:12px;background:#0b0d15;padding:2px 8px;border-radius:4px;">${p.transactionId || "—"}</code></td>
          <td>$${p.amount || 0}</td>
          <td>${proofLink}</td>
          <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
          <td>
            <div class="action-btns">
              ${statusClass === "pending" ? `
                <button class="btn-approve" data-id="${p.id}" data-uid="${p.userId}">Approve</button>
                <button class="btn-reject" data-id="${p.id}" data-uid="${p.userId}">Reject</button>
              ` : "—"}
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;

    // ─── Attach event listeners ─────────────────────────────
    document.querySelectorAll(".btn-approve").forEach((btn) => {
      btn.addEventListener("click", () => handleAction(btn.dataset.id, btn.dataset.uid, "approved"));
    });
    document.querySelectorAll(".btn-reject").forEach((btn) => {
      btn.addEventListener("click", () => handleAction(btn.dataset.id, btn.dataset.uid, "rejected"));
    });
  }

  // ─── HANDLE APPROVE / REJECT ──────────────────────────────
  async function handleAction(paymentId, userId, status) {
    if (!confirm(`Are you sure you want to ${status} this payment?`)) return;

    try {
      // 1. Update payment status
      await updateDoc(doc(db, "payments", paymentId), {
        status: status,
        reviewedAt: serverTimestamp(),
      });

      // 2. If approved, upgrade user to premium
      if (status === "approved") {
        await updateDoc(doc(db, "users", userId), {
          membership: "premium",
          updatedAt: serverTimestamp(),
        });
        alert("✅ Payment approved and user upgraded to Premium!");
      } else {
        alert("❌ Payment rejected.");
      }
    } catch (error) {
      console.error("Action error:", error);
      alert("Failed to update payment. Please try again.");
    }
  }

  // ─── UPDATE STATS ──────────────────────────────────────────
  function updateStats(payments) {
    let pending = 0, approved = 0, rejected = 0;
    payments.forEach((p) => {
      const s = p.status || "pending";
      if (s === "pending") pending++;
      else if (s === "approved") approved++;
      else if (s === "rejected") rejected++;
    });
    statPending.textContent = pending;
    statApproved.textContent = approved;
    statRejected.textContent = rejected;
    statTotal.textContent = payments.length;
  }

  console.log("✅ Admin payments page ready.");
</script>

</body>
</html>
