<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Academy Admin | GTRADES-AXIS™</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Poppins, sans-serif;
            background: #0b0d15;
            color: #e8edf5;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #131724;
            border-right: 1px solid #2a3450;
            padding: 28px 18px;
            flex-shrink: 0;
        }

        .logo h2 {
            font-size: 18px;
            background: linear-gradient(
                135deg,
                #fff 30%,
                #00d4ff
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo span {
            -webkit-text-fill-color: #4f7cff;
        }

        nav {
            margin-top: 30px;
        }

        nav ul {
            list-style: none;
        }

        nav li {
            margin: 6px 0;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 11px 14px;
            border-radius: 8px;
            color: #9aa4bf;
            text-decoration: none;
        }

        nav a:hover {
            background: #1a1f2f;
            color: #fff;
        }

        nav li.active a {
            color: #4f7cff;
            background: rgba(79,124,255,.15);
            border-left: 3px solid #4f7cff;
        }

        .main {
            flex: 1;
            padding: 35px 40px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .top h1 {
            font-size: 28px;
        }

        .top p {
            color: #9aa4bf;
            margin-top: 5px;
        }

        .admin-badge {
            background: rgba(79,124,255,.15);
            color: #4f7cff;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .module-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .module {
            background: #131724;
            border: 1px solid #2a3450;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .module:hover {
            border-color: #4f7cff;
        }

        .module h3 {
            margin-bottom: 5px;
        }

        .module p {
            color: #9aa4bf;
            font-size: 13px;
        }

        .module-actions {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: Poppins, sans-serif;
        }

        .edit {
            background: #4f7cff;
            color: white;
            padding: 9px 17px;
            border-radius: 7px;
        }

        .delete {
            background: rgba(255,71,102,.1);
            color: #ff4766;
            padding: 9px 17px;
            border-radius: 7px;
        }

        .locked {
            display: none;
            text-align: center;
            max-width: 600px;
            margin: 80px auto;
        }

        .locked.show {
            display: block;
        }

        .locked i {
            font-size: 60px;
            color: #ff4766;
            margin-bottom: 20px;
        }

        .locked h2 {
            margin-bottom: 10px;
        }

        .locked p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .back {
            display: inline-block;
            padding: 11px 25px;
            background: #1a1f2f;
            border: 1px solid #2a3450;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
        }

        #loading {
            text-align: center;
            padding: 100px;
        }

        @media(max-width:768px) {

            .sidebar {
                display: none;
            }

            .main {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

<div class="layout">


    <!-- ================= ADMIN SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            <h2>
                GTRADES <span>AXIS™</span>
            </h2>
        </div>


        <nav>

            <ul>

                <li>
                    <a href="/dashboard">
                        <i class="fas fa-house"></i>
                        Dashboard
                    </a>
                </li>


                <!-- ADMIN ONLY -->

                <li class="active">
                    <a href="/academy-admin.html">
                        <i class="fas fa-book-open"></i>
                        Academy Admin
                    </a>
                </li>


                <li>
                    <a href="/resources">
                        <i class="fas fa-folder-open"></i>
                        Resources
                    </a>
                </li>


                <li>
                    <a href="/videos">
                        <i class="fas fa-circle-play"></i>
                        Videos
                    </a>
                </li>


                <li>
                    <a href="/profile">
                        <i class="fas fa-user"></i>
                        Profile
                    </a>
                </li>

            </ul>

        </nav>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">


        <div id="loading">
            Checking administrator access...
        </div>


        <!-- LOCK -->

        <div
            id="locked"
            class="locked"
        >

            <i class="fas fa-shield-halved"></i>

            <h2>
                Administrator Access Only
            </h2>

            <p>
                You do not have permission to access
                Academy Management.
            </p>

            <a
                href="/dashboard"
                class="back"
            >
                Back to Dashboard
            </a>

        </div>


        <!-- ADMIN -->

        <div
            id="adminContent"
            style="display:none;"
        >

            <div class="top">

                <div>

                    <h1>
                        Academy Management
                    </h1>

                    <p>
                        Manage Academy modules and lessons.
                    </p>

                </div>

                <div class="admin-badge">
                    ADMINISTRATOR
                </div>

            </div>


            <div
                id="moduleList"
                class="module-list"
            ></div>

        </div>

    </main>

</div>


<script type="importmap">
{
    "imports": {
        "firebase": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
    }
}
</script>


<script type="module">

import { auth, db }
    from "./js/firebase.js";

import {
    onAuthStateChanged
}
from "firebase/auth";

import {
    doc,
    getDoc,
    collection,
    getDocs
}
from "firebase/firestore";


const loading =
    document.getElementById("loading");

const locked =
    document.getElementById("locked");

const adminContent =
    document.getElementById("adminContent");

const moduleList =
    document.getElementById("moduleList");


onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "/login";

            return;

        }


        try {

            const userSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if (
                !userSnap.exists() ||
                userSnap.data().role !== "admin"
            ) {

                loading.style.display =
                    "none";

                locked.classList.add(
                    "show"
                );

                return;

            }


            loading.style.display =
                "none";

            adminContent.style.display =
                "block";


            await loadModules();


        } catch (error) {

            console.error(error);

            loading.style.display =
                "none";

            locked.classList.add(
                "show"
            );

        }

    }
);


/* ================= MODULES ================= */

async function loadModules() {

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "academy_modules"
                )
            );


        if (snapshot.empty) {

            moduleList.innerHTML = `

                <div class="module">

                    <div>

                        <h3>
                            No modules found
                        </h3>

                        <p>
                            Create Academy modules
                            in Firestore.
                        </p>

                    </div>

                </div>

            `;

            return;

        }


        let html = "";


        snapshot.forEach(
            (item) => {

                const data =
                    item.data();


                html += `

                    <div class="module">

                        <div>

                            <h3>
                                Module
                                ${data.order || ""}
                                :
                                ${escapeHtml(
                                    data.title ||
                                    "Untitled"
                                )}
                            </h3>

                            <p>
                                ${
                                    data.lessons?.length ||
                                    0
                                }
                                lessons
                            </p>

                        </div>

                        <div class="module-actions">

                            <button
                                class="edit"
                                onclick="
                                    editModule('${item.id}')
                                "
                            >
                                <i class="fas fa-edit"></i>
                                Edit
                            </button>

                            <button
                                class="delete"
                                onclick="
                                    deleteModule('${item.id}')
                                "
                            >
                                <i class="fas fa-trash"></i>
                            </button>

                        </div>

                    </div>

                `;

            }
        );


        moduleList.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Failed to load modules:",
            error
        );

        moduleList.innerHTML = `

            <div class="module">

                <h3>
                    Failed to load modules
                </h3>

            </div>

        `;

    }

}


function editModule(id) {

    /*
     * Keep your existing lesson editor here.
     *
     * This page is intentionally separate
     * from the student Academy portal.
     */

    window.location.href =
        `/academy-admin.html?module=${encodeURIComponent(id)}`;

}


async function deleteModule(id) {

    alert(
        "Module deletion can be enabled here after confirming your Firestore structure."
    );

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
</html>
