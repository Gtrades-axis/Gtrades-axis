<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | GTRADES-AXIS™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="premium-academy.css">
  <style>
    .quiz-container { max-width: 750px; margin: 0 auto; padding: 20px; }
    .question-block { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; margin-bottom: 16px; }
    .question-text { font-weight: 600; margin-bottom: 10px; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .options label { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .options label:hover { background: rgba(255,255,255,0.08); }
    .options input[type="radio"] { accent-color: #1d9bf0; width: 18px; height: 18px; }
    .result-box { text-align: center; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 12px; }
    .result-box .score { font-size: 3rem; font-weight: 700; }
    .result-box .pass { color: #00c853; }
    .result-box .fail { color: #ff4d4f; }
    .btn-secondary { background: rgba(255,255,255,0.05); color: #aab7c8; border: 1px solid rgba(255,255,255,0.08); padding: 8px 20px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
<div class="academy-container">
  <aside class="sidebar">
    <div class="logo"><h2>GTRADES <span>AXIS™</span></h2><p>Premium Academy</p></div>
    <nav>
      <ul>
        <li><i class="fas fa-house"></i> Dashboard</li>
        <li class="active"><i class="fas fa-book-open"></i> Modules</li>
        <li><i class="fas fa-folder-open"></i> Resources</li>
        <li><i class="fas fa-brain"></i> AI Review</li>
        <li><i class="fas fa-award"></i> Certificates</li>
        <li><i class="fas fa-user"></i> Profile</li>
      </ul>
    </nav>
  </aside>
  <div class="content">
    <header class="topbar">
      <div><h1 id="quizTitle">Loading Quiz...</h1><p id="quizModule">Loading module...</p></div>
      <div class="user-box"><img src="images/avatar.png" alt=""><div><h4>Student</h4><p>Premium Member</p></div></div>
    </header>
    <div class="quiz-container" id="quizContainer">
      <div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin"></i> Loading quiz…</div>
    </div>
  </div>
</div>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/quiz.js"></script>
</body>
</html>
