<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email | GTRADES-AXIS™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="css/login.css" />
    <style>
        .verify-container { max-width: 440px; margin: 40px auto; text-align: center; }
        .verify-container h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .verify-container h1 span { background: linear-gradient(135deg, #0f8cff, #00c853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .verify-container p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
        .btn-secondary { background: rgba(255,255,255,0.06); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.08); padding: 12px 24px; border-radius: 12px; font-weight: 500; cursor: pointer; }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .btn-primary { background: linear-gradient(135deg, #0f8cff, #0077e6); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,140,255,0.3); }
        .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
        .status.success { background: rgba(0,200,83,0.12); color: #00c853; }
        .status.error { background: rgba(255,77,79,0.12); color: #ff4d4f; }
        .links-row { margin-top: 20px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .links-row a { color: #0f8cff; text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .links-row a:hover { text-decoration: underline; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card verify-container">
            <img src="images/imageslogo.png.png" alt="Logo" style="height:60px; margin-bottom:16px;" />
            <h1>📧 Verify Your <span>Email</span></h1>
            <p id="statusMessage">We've sent a verification link to your email address. Please click the link to verify your account.</p>
            <p style="font-size:0.85rem; color:#64748b;">After verification, you'll be automatically redirected.</p>
            <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px;">
                <button id="resendBtn" class="btn-secondary"><i class="fa-solid fa-rotate"></i> Resend Email</button>
                <a href="/login" class="btn-primary"><i class="fa-solid fa-arrow-right-to-bracket"></i> Go to Login</a>
            </div>
            <div id="statusMsg" class="status" style="display:none;"></div>
            <div class="links-row">
                <a href="/register"><i class="fa-regular fa-user"></i> Create a new account</a>
                <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
        }
    }
    </script>

    <script type="module">
        import { auth, db } from "./js/firebase.js";
        import { onAuthStateChanged, sendEmailVerification } from "firebase/auth";
        import { doc, getDoc } from "firebase/firestore";

        const statusMessage = document.getElementById('statusMessage');
        const statusMsg = document.getElementById('statusMsg');
        const resendBtn = document.getElementById('resendBtn');

        // ─── Auto-check verification status ──────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Not logged in – stay on page, show message
                statusMessage.textContent = "You are not logged in. Please register or log in.";
                return;
            }

            // If user is verified, check approval and redirect
            if (user.emailVerified) {
                statusMessage.textContent = "✅ Email verified! Redirecting...";
                statusMsg.className = 'status success';
                statusMsg.style.display = 'block';
                statusMsg.textContent = 'Email verified!';

                // Get user document to check active status
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        if (userData.active === true) {
                            // Approved – go to dashboard
                            window.location.href = '/dashboard';
                        } else {
                            // Not approved – go to pending
                            window.location.href = '/pending';
                        }
                    } else {
                        // User document not found – go to pending? or login?
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error("Error fetching user data:", e);
                    window.location.href = '/dashboard';
                }
                return;
            }

            // If not verified, show message and resend option
            statusMessage.textContent = "We've sent a verification link to your email. Please check your inbox (and spam folder).";
            statusMsg.style.display = 'none';
        });

        // ─── Resend verification ──────────────────────────────────
        resendBtn.addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) {
                statusMsg.textContent = '⚠️ You are not logged in. Please log in and try again.';
                statusMsg.className = 'status error';
                statusMsg.style.display = 'block';
                return;
            }
            if (user.emailVerified) {
                statusMsg.textContent = '✅ Your email is already verified. Redirecting...';
                statusMsg.className = 'status success';
                statusMsg.style.display = 'block';
                setTimeout(() => window.location.href = '/dashboard', 1500);
                return;
            }
            try {
                await sendEmailVerification(user);
                statusMsg.textContent = '✅ Verification email resent! Check your inbox.';
                statusMsg.className = 'status success';
                statusMsg.style.display = 'block';
            } catch (error) {
                statusMsg.textContent = '❌ Failed to resend: ' + error.message;
                statusMsg.className = 'status error';
                statusMsg.style.display = 'block';
            }
        });
    </script>
    <script src="/js/responsive.js" defer></script>
</body>
</html>
