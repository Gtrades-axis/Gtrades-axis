<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | GTRADES-AXIS™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="css/login.css" />
    <style>
        .password-group { position: relative; }
        .password-group input { padding-right: 48px; }
        .toggle-pw { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #888; font-size: 1.1rem; padding: 0; }
        .toggle-pw:hover { color: #333; }
        .google-btn { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 30px; background: #fff; font-weight: 500; font-size: 1rem; color: #333; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; transition: 0.2s; margin-bottom: 16px; }
        .google-btn:hover { background: #f8f9fa; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .divider-or { display: flex; align-items: center; gap: 16px; color: #aaa; font-size: 0.85rem; margin: 0 0 20px 0; }
        .divider-or::before, .divider-or::after { content: ""; flex: 1; height: 1px; background: #ddd; }
        .msg.error { background: rgba(255, 71, 102, 0.15); color: #ff4766; border: 1px solid #ff4766; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.85rem; }
        .msg.success { background: rgba(0, 200, 151, 0.15); color: #00c897; border: 1px solid #00c897; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.85rem; }
        .password-hint { font-size: 0.75rem; color: #888; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-wrapper"><img src="images/imageslogo.png.png" alt="GTRADES-AXIS Logo" class="login-logo" draggable="false" /></div>
            <h1>Create <span class="gradient-text">Account</span></h1>
            <p class="subtitle">Join the GTRADES-AXIS™ Community</p>

            <!-- Google Sign-Up -->
            <button class="google-btn" id="googleRegisterBtn">
                <i class="fa-brands fa-google"></i> Sign up with Google
            </button>
            <div class="divider-or">or</div>

            <div id="errorMsg" class="msg error" style="display:none;"></div>
            <div id="successMsg" class="msg success" style="display:none;"></div>

            <form id="registerForm">
                <div class="input-group"><i class="fa-regular fa-user"></i><input type="text" id="displayName" placeholder="Full Name" required /></div>
                <div class="input-group"><i class="fa-regular fa-envelope"></i><input type="email" id="email" placeholder="Email Address" required /></div>
                <div class="input-group password-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Password (min 6 chars)" required minlength="6" />
                    <button type="button" class="toggle-pw" id="togglePassword"><i class="fa-regular fa-eye"></i></button>
                </div>
                <div class="input-group password-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
                    <button type="button" class="toggle-pw" id="toggleConfirmPassword"><i class="fa-regular fa-eye"></i></button>
                </div>
                <div class="password-hint">Password must be at least 6 characters.</div>
                <button type="submit" class="login-btn" id="registerBtn"><i class="fa-solid fa-user-plus"></i> <span>Sign Up</span></button>
            </form>

            <div class="divider"><span class="divider-line"></span><span class="divider-text">secure access</span><span class="divider-line"></span></div>
            <div class="login-links">Already have an account? <a href="/login">Log In</a></div>
            <a class="back-home" href="/"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
        }
    }
    </script>

    <script type="module">
        import { auth, db } from "./js/firebase.js";
        import { signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, updateProfile, sendEmailVerification } from "firebase/auth";
        import { doc, setDoc, serverTimestamp } from "firebase/firestore";

        const googleBtn = document.getElementById('googleRegisterBtn');
        const registerForm = document.getElementById('registerForm');
        const displayNameInput = document.getElementById('displayName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const registerBtn = document.getElementById('registerBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        // Toggle password visibility
        document.querySelectorAll('.toggle-pw').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                const icon = this.querySelector('i');
                if (icon) { icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash'); }
            });
        });

        function showError(message) { successMsg.style.display = 'none'; errorMsg.textContent = message; errorMsg.style.display = 'block'; }
        function showSuccess(message) { errorMsg.style.display = 'none'; successMsg.textContent = message; successMsg.style.display = 'block'; }
        function hideMessages() { errorMsg.style.display = 'none'; successMsg.style.display = 'none'; }

        // ─── GOOGLE SIGN UP ──────────────────────────────────────
        googleBtn.addEventListener('click', async function() {
            hideMessages();
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid, displayName: user.displayName || user.email, email: user.email,
                    role: 'member', membership: 'free', status: 'active', paymentStatus: 'unpaid',
                    emailVerified: user.emailVerified,
                    createdAt: serverTimestamp(), updatedAt: serverTimestamp()
                });
                window.location.href = '/dashboard';
            } catch (error) {
                showError("Google sign-up failed: " + error.message);
            }
        });

        // ─── EMAIL SIGN UP ──────────────────────────────────────
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // ✅ prevents page reload
            hideMessages();

            const displayName = displayNameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const confirm = confirmPasswordInput.value.trim();

            if (!displayName || !email || !password || !confirm) return showError("Please fill in all fields.");
            if (password !== confirm) return showError("Passwords do not match.");
            if (password.length < 6) return showError("Password must be at least 6 characters.");

            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await updateProfile(user, { displayName: displayName });
                await sendEmailVerification(user);

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid, displayName: displayName, email: email,
                    role: 'member', membership: 'free', status: 'pending', paymentStatus: 'unpaid',
                    emailVerified: false,
                    createdAt: serverTimestamp(), updatedAt: serverTimestamp()
                });

                showSuccess("✅ Account created! Verification email sent. Redirecting...");
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Sign Up';

                setTimeout(() => { window.location.href = '/verify-email'; }, 2500);

            } catch (error) {
                console.error(error);
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') msg = "This email is already registered.";
                else if (error.code === 'auth/invalid-email') msg = "Invalid email address.";
                else if (error.code === 'auth/network-request-failed') msg = "Network error. Check your connection.";
                showError("❌ " + msg);
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Sign Up';
            }
        });
    </script>
</body>
</html>
