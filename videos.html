  <style>
    * {

    body {

      background: #05070b;

      font-family: Arial, Helvetica, sans-serif;

    header {

      border-bottom: 1px solid #1d2938;
      padding: 22px 5%;
    }

    .brand {

      font-weight: 800;

    }

    .brand span {

    .subtitle {
      color: #8d9aae;

      font-size: 14px;

    main {
      width: min(1200px, 94%);
      margin: auto;
      padding: 30px 0 60px;

    .hero h1 {
      margin: 0;
      font-size: 32px;
    }

    .hero p {
      color: #94a3b8;
      margin-top: 10px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;

      margin: 25px 0;

    .filter-btn {
      border: 1px solid #263244;

      color: #b8c3d1;
      padding: 10px 16px;

      cursor: pointer;
      transition: 0.2s ease;
    }

    .filter-btn:hover,

      background: #2196f3;

      color: white;

    .player-panel {
      background: #090d14;
      border: 1px solid #1d2938;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 35px;
    }

    .player-header {
      padding: 18px 20px;
      border-bottom: 1px solid #1d2938;
    }

    .player-label {
      color: #2196f3;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #nowPlayingTitle {
      margin-top: 7px;
      font-size: 20px;
      font-weight: 700;
    }

    .player-wrapper {
      background: #000;
      width: 100%;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #r2VideoPlayer {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }

    #playerMessage {
      display: none;
      color: #94a3b8;
      padding: 70px 20px;
      text-align: center;
    }

    #playerMessage.show {
      display: block;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 18px;
    }

    #videosContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #0b1018;
      border: 1px solid #1d2938;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: #2196f3;
    }

    .video-thumb {
      height: 150px;
      background: #101722;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .play-icon {
      font-size: 46px;
      color: #2196f3;
    }

    .video-info {
      padding: 16px;
    }

    .video-title {
      font-weight: 700;
      line-height: 1.4;
    }

    .video-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: #8d9aae;
      font-size: 13px;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
    }

    .badge-free {
      background: #123b27;
      color: #55e89a;
    }

    .badge-premium {
      background: #392b08;
      color: #f5c451;
    }

    .status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #94a3b8;
    }

    #noResultsMessage {
      display: none;
      text-align: center;
      color: #94a3b8;
      padding: 50px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 26px;
      }

      .player-wrapper {
        min-height: 220px;
      }

      #videosContainer {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<script type="module">

/* ============================================================
   FIREBASE
============================================================ */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";


/* ============================================================
   FIREBASE CONFIG
============================================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyBZmsLm64PyEL9jifi32bpgvWfhluIWCZM",

  authDomain:
    "gtrades-axis.firebaseapp.com",

  projectId:
    "gtrades-axis",

  storageBucket:
    "gtrades-axis.firebasestorage.app",

  messagingSenderId:
    "111456545888",

  appId:
    "1:111456545888:web:f0526c142d7ea5e22fe705"

};


/* ============================================================
   INITIALIZE FIREBASE
============================================================ */

const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);


/* ============================================================
   CLOUDFLARE R2
============================================================ */

const R2_WORKER =
  "https://r2-uploader.davidthuku574.workers.dev";


/* ============================================================
   ELEMENTS
============================================================ */

const player =
  document.getElementById(
    "r2VideoPlayer"
  );

const playerMessage =
  document.getElementById(
    "playerMessage"
  );

const nowPlayingTitle =
  document.getElementById(
    "nowPlayingTitle"
  );

const videosContainer =
  document.getElementById(
    "videosContainer"
  );

const noResults =
  document.getElementById(
    "noResultsMessage"
  );

const filterButtons =
  document.querySelectorAll(
    ".filter-btn"
  );


/* ============================================================
   STATE
============================================================ */

let videos = [];

let activeCategory =
  "All";


/* ============================================================
   GET VIDEO KEY
============================================================ */

function getVideoKey(video) {

  return (
    video.videoKey ||
    video.fileKey ||
    video.r2Key ||
    video.storageKey ||
    video.key ||
    ""
  );

}


/* ============================================================
   BUILD R2 VIDEO URL

   IMPORTANT:
   The worker serves files through:

   /file?key=...

   Do NOT use:

   /?key=...

   Do NOT use:

   ?action=file

============================================================ */

function buildR2URL(videoKey) {

  if (!videoKey) {

    throw new Error(
      "This video does not have a videoKey."
    );

  }

  const url =
    new URL(
      "/file",
      R2_WORKER
    );

  url.searchParams.set(
    "key",
    videoKey
  );

  return url.toString();

}


/* ============================================================
   LOAD VIDEOS
============================================================ */

async function loadVideos() {

  console.log(
    "GTRADES-AXIS™: Loading videos..."
  );

  videosContainer.innerHTML = `
    <div class="status">
      Loading videos...
    </div>
  `;

  try {

    let snapshot;


    /* --------------------------------------------------------
       FIRST: ORDERED QUERY
    -------------------------------------------------------- */

    try {

      const videosQuery =
        query(
          collection(
            db,
            "videos"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        );

      snapshot =
        await getDocs(
          videosQuery
        );

    }

    catch (error) {

      console.warn(
        "createdAt ordering failed.",
        error
      );

      /* ------------------------------------------------------
         FALLBACK
      ------------------------------------------------------ */

      snapshot =
        await getDocs(
          collection(
            db,
            "videos"
          )
        );

    }


    /* --------------------------------------------------------
       BUILD ARRAY
    -------------------------------------------------------- */

    videos = [];

    snapshot.forEach(
      docSnap => {

        const data =
          docSnap.data();

        const video = {

          id:
            docSnap.id,

          ...data

        };

        console.log(
          "VIDEO DOCUMENT:",
          video
        );

        videos.push(
          video
        );

      }
    );


    /* --------------------------------------------------------
       LOCAL SORT
    -------------------------------------------------------- */

    videos.sort(
      (a, b) => {

        const aSeconds =
          a.createdAt?.seconds ||
          0;

        const bSeconds =
          b.createdAt?.seconds ||
          0;

        return (
          bSeconds -
          aSeconds
        );

      }
    );


    console.log(
      "TOTAL VIDEOS:",
      videos.length
    );


    /* --------------------------------------------------------
       RENDER
    -------------------------------------------------------- */

    renderVideos();


    /* --------------------------------------------------------
       OPEN FIRST VIDEO
    -------------------------------------------------------- */

    if (
      videos.length > 0
    ) {

      const firstVideo =
        videos.find(
          video =>
            !!getVideoKey(video)
        );

      if (firstVideo) {

        console.log(
          "Opening first video:",
          firstVideo
        );

        openVideo(
          firstVideo,
          false
        );

      }

    }

    else {

      videosContainer.innerHTML = `
        <div class="status">
          No videos available yet.
        </div>
      `;

    }

  }

  catch (error) {

    console.error(
      "FIRESTORE VIDEO ERROR:",
      error
    );

    videosContainer.innerHTML = `
      <div class="status">
        Unable to load videos.
      </div>
    `;

  }

}


/* ============================================================
   RENDER VIDEOS
============================================================ */

function renderVideos() {

  videosContainer.innerHTML = "";

  noResults.style.display =
    "none";


  let filtered =
    [...videos];


  /* ----------------------------------------------------------
     CATEGORY
  ---------------------------------------------------------- */

  if (
    activeCategory !==
    "All"
  ) {

    filtered =
      filtered.filter(
        video => {

          const category =
            String(
              video.category ||
              "General"
            )
            .toLowerCase()
            .trim();

          return (
            category ===
            activeCategory
              .toLowerCase()
              .trim()
          );

        }
      );

  }


  /* ----------------------------------------------------------
     EMPTY
  ---------------------------------------------------------- */

  if (
    filtered.length === 0
  ) {

    noResults.style.display =
      "block";

    return;

  }


  /* ----------------------------------------------------------
     CARDS
  ---------------------------------------------------------- */

  filtered.forEach(
    video => {

      videosContainer.appendChild(
        createVideoCard(video)
      );

    }
  );

}


/* ============================================================
   CREATE VIDEO CARD
============================================================ */

function createVideoCard(video) {

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "video-card";


  const title =
    video.title ||
    "Untitled Video";


  const category =
    video.category ||
    "General";


  const premium =
    video.premiumOnly === true ||
    video.access === "premium" ||
    video.status === "premium";


  const videoKey =
    getVideoKey(video);


  card.innerHTML = `

    <div class="video-thumb">

      <div class="play-icon">
        ▶
      </div>

    </div>

    <div class="video-info">

      <div class="video-title">
        ${escapeHTML(title)}
      </div>

      <div class="video-meta">

        <span>
          ${escapeHTML(category)}
        </span>

        <span
          class="badge ${
            premium
              ? "badge-premium"
              : "badge-free"
          }"
        >

          ${
            premium
              ? "Premium"
              : "Free"
          }

        </span>

      </div>

    </div>

  `;


  /* ----------------------------------------------------------
     DISABLE CARD WITHOUT FILE
  ---------------------------------------------------------- */

  if (!videoKey) {

    card.style.opacity =
      "0.55";

    card.title =
      "This video has no R2 file attached.";

  }


  /* ----------------------------------------------------------
     CLICK
  ---------------------------------------------------------- */

  card.addEventListener(
    "click",
    () => {

      if (!videoKey) {

        showPlayerError(
          "This video has no R2 file attached."
        );

        return;

      }

      openVideo(
        video,
        true
      );

    }
  );


  return card;

}


/* ============================================================
   OPEN VIDEO
============================================================ */

function openVideo(
  video,
  scroll = true
) {

  console.log(
    "OPEN VIDEO:",
    video
  );


  const videoKey =
    getVideoKey(video);


  if (!videoKey) {

    console.error(
      "MISSING VIDEO KEY:",
      video
    );

    showPlayerError(
      "This video has no R2 file attached."
    );

    return;

  }


  let videoURL;

  try {

    videoURL =
      buildR2URL(
        videoKey
      );

  }

  catch (error) {

    console.error(
      "R2 URL ERROR:",
      error
    );

    showPlayerError(
      error.message
    );

    return;

  }


  console.log(
    "R2 VIDEO KEY:",
    videoKey
  );

  console.log(
    "R2 VIDEO URL:",
    videoURL
  );


  /* ----------------------------------------------------------
     TITLE
  ---------------------------------------------------------- */

  nowPlayingTitle.textContent =
    video.title ||
    "GTRADES-AXIS™ Video";


  /* ----------------------------------------------------------
     HIDE ERROR
  ---------------------------------------------------------- */

  playerMessage.classList.remove(
    "show"
  );


  /* ----------------------------------------------------------
     STOP OLD VIDEO
  ---------------------------------------------------------- */

  try {

    player.pause();

  }

  catch (_) {}


  player.removeAttribute(
    "src"
  );

  player.load();


  /* ----------------------------------------------------------
     SET R2 SOURCE
  ---------------------------------------------------------- */

  player.src =
    videoURL;


  /* ----------------------------------------------------------
     EVENTS
  ---------------------------------------------------------- */

  player.onerror =
    () => {

      console.error(
        "VIDEO PLAYER ERROR:",
        player.error
      );

      showPlayerError(
        "Unable to play this video from Cloudflare R2."
      );

    };


  player.onloadedmetadata =
    () => {

      console.log(
        "VIDEO METADATA LOADED:",
        videoURL
      );

    };


  player.load();


  /* ----------------------------------------------------------
     SCROLL
  ---------------------------------------------------------- */

  if (scroll) {

    document
      .querySelector(
        ".player-panel"
      )
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

  }


  /* ----------------------------------------------------------
     AUTOPLAY
  ---------------------------------------------------------- */

  player.play()
    .then(
      () => {

        console.log(
          "Video autoplay started."
        );

      }
    )
    .catch(
      error => {

        console.log(
          "Autoplay blocked. User can press Play.",
          error
        );

      }
    );

}


/* ============================================================
   PLAYER ERROR
============================================================ */

function showPlayerError(
  message
) {

  try {

    player.pause();

  }

  catch (_) {}


  player.removeAttribute(
    "src"
  );

  player.load();


  nowPlayingTitle.textContent =
    "Video unavailable";


  playerMessage.textContent =
    message;


  playerMessage.classList.add(
    "show"
  );

}


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ============================================================
   FILTER BUTTONS
============================================================ */

filterButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        filterButtons.forEach(
          btn => {

            btn.classList.remove(
              "active"
            );

          }
        );


        button.classList.add(
          "active"
        );


        activeCategory =
          button.dataset.category ||
          "All";


        renderVideos();

      }
    );

  }
);


/* ============================================================
   AUTHENTICATION
============================================================ */

onAuthStateChanged(
  auth,
  user => {

    console.log(
      "AUTH STATE:",
      user
    );


    if (!user) {

      window.location.href =
        "/login.html";

      return;

    }


    console.log(
      "Authenticated user:",
      user.uid
    );


    loadVideos();

  }
);


/* ============================================================
   DEBUG
============================================================ */

console.log(
  "GTRADES-AXIS™ Video Academy loaded."
);

console.log(
  "Cloudflare R2 Worker:",
  R2_WORKER
);

</script>

</body>
