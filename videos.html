<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Videos | GTRADES-AXIS™</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Poppins, sans-serif;
      background: #080b12;
      color: #edf2f7;
      min-height: 100vh;
    }

    /* ======================================================
       LAYOUT
    ====================================================== */

    .page {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background: #111621;
      border-right: 1px solid #273149;
      padding: 25px 16px;
      flex-shrink: 0;
    }

    .logo {
      padding: 5px 12px 25px;
      font-size: 19px;
      font-weight: 800;
    }

    .logo span {
      color: #4f7cff;
    }

    .nav {
      list-style: none;
    }

    .nav li {
      margin-bottom: 6px;
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 13px;
      color: #9ca8bd;
      text-decoration: none;
      border-radius: 8px;
      transition: .2s;
    }

    .nav a:hover,
    .nav .active a {
      color: #fff;
      background: rgba(79,124,255,.14);
    }

    .nav .active a {
      border-left: 3px solid #4f7cff;
    }

    #logoutBtn {
      width: 100%;
      margin-top: 35px;
      padding: 11px;
      border: 1px solid rgba(255,71,102,.25);
      background: rgba(255,71,102,.08);
      color: #ff6b81;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ======================================================
       MAIN
    ====================================================== */

    .main {
      flex: 1;
      padding: 35px;
      min-width: 0;
    }

    .header {
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .header p {
      color: #8e9bb2;
    }

    /* ======================================================
       CONTROLS
    ====================================================== */

    .controls {
      margin-bottom: 25px;
    }

    .search {
      width: 100%;
      max-width: 450px;
      padding: 13px 15px;
      border-radius: 9px;
      border: 1px solid #29344d;
      background: #121824;
      color: white;
      outline: none;
      margin-bottom: 15px;
    }

    .search:focus {
      border-color: #4f7cff;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      padding: 8px 15px;
      border-radius: 20px;
      border: 1px solid #29344d;
      background: #121824;
      color: #9ca8bd;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #4f7cff;
      border-color: #4f7cff;
      color: white;
    }

    /* ======================================================
       VIDEO GRID
    ====================================================== */

    .video-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #111621;
      border: 1px solid #273149;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: .2s;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: #4f7cff;
    }

    .video-card.locked {
      cursor: not-allowed;
      opacity: .65;
    }

    .thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0d131e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumbnail img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-icon {
      font-size: 45px;
      color: #4f7cff;
    }

    .duration {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(0,0,0,.8);
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 2;
    }

    .lock {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      z-index: 3;
    }

    .lock i {
      color: #f5a623;
      font-size: 32px;
    }

    .info {
      padding: 15px;
    }

    .title {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      color: #8e9bb2;
      font-size: 12px;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 15px;
      font-size: 10px;
      font-weight: 700;
    }

    .premium {
      color: #f5a623;
      background: rgba(245,166,35,.12);
    }

    .free {
      color: #00c897;
      background: rgba(0,200,151,.12);
    }

    /* ======================================================
       STATUS
    ====================================================== */

    .status {
      text-align: center;
      padding: 60px 20px;
      color: #8e9bb2;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #273149;
      border-top-color: #4f7cff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ======================================================
       MODAL
    ====================================================== */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 1050px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #videoPlayer {
      display: block;
      width: 100%;
      max-height: 80vh;
      background: #000;
    }

    .close {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 5;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,.75);
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    /* ======================================================
       MOBILE
    ====================================================== */

    @media (max-width: 750px) {

      .page {
        display: block;
      }

      .sidebar {
        width: 100%;
      }

      .main {
        padding: 20px 15px;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

<div class="page">

  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside class="sidebar">

    <div class="logo">
      GTRADES <span>AXIS™</span>
    </div>

    <ul class="nav">

      <li>
        <a href="/dashboard">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>
      </li>

      <li>
        <a href="/resources">
          <i class="fa-solid fa-folder"></i>
          Premium Resources
        </a>
      </li>

      <li>
        <a href="/premium-academy">
          <i class="fa-solid fa-graduation-cap"></i>
          Premium Academy
        </a>
      </li>

      <li class="active">
        <a href="/videos">
          <i class="fa-solid fa-circle-play"></i>
          Videos
        </a>
      </li>

      <li>
        <a href="/journal">
          <i class="fa-solid fa-chart-line"></i>
          Trading Journal
        </a>
      </li>

      <li>
        <a href="/profile">
          <i class="fa-solid fa-user"></i>
          My Profile
        </a>
      </li>

      <li>
        <a href="/support">
          <i class="fa-solid fa-headset"></i>
          Support
        </a>
      </li>

    </ul>

    <button id="logoutBtn">
      <i class="fa-solid fa-right-from-bracket"></i>
      Logout
    </button>

  </aside>

  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main">

    <header class="header">

      <h1>Trading Videos</h1>

      <p>
        Premium trading tutorials and market breakdowns.
      </p>

    </header>

    <!-- ===================================================
         CONTROLS
    ==================================================== -->

    <section class="controls">

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search videos..."
      >

      <div class="filters">

        <button
          class="filter-btn active"
          data-category="All"
        >
          All
        </button>

        <button
          class="filter-btn"
          data-category="Market Structure"
        >
          Market Structure
        </button>

        <button
          class="filter-btn"
          data-category="Supply & Demand"
        >
          Supply &amp; Demand
        </button>

        <button
          class="filter-btn"
          data-category="Liquidity"
        >
          Liquidity
        </button>

        <button
          class="filter-btn"
          data-category="Entries"
        >
          Entries
        </button>

        <button
          class="filter-btn"
          data-category="Psychology"
        >
          Psychology
        </button>

      </div>

    </section>

    <!-- ===================================================
         VIDEOS
    ==================================================== -->

    <section
      id="videosContainer"
      class="video-grid"
    >

      <div class="status">
        <div class="spinner"></div>
        <p style="margin-top:15px;">
          Loading videos...
        </p>
      </div>

    </section>

    <div
      id="noResultsMessage"
      class="status"
      style="display:none;"
    >
      No videos found.
    </div>

  </main>

</div>

<!-- =======================================================
     VIDEO MODAL
======================================================== -->

<div
  id="videoModal"
  class="modal"
>

  <div class="modal-box">

    <button
      id="closeModal"
      class="close"
      aria-label="Close video"
    >
      &times;
    </button>

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    ></video>

  </div>

</div>

<!-- =======================================================
     FIREBASE IMPORT MAP
======================================================== -->

<script type="importmap">
{
  "imports": {
    "firebase/auth":
      "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",

    "firebase/firestore":
      "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
  }
}
</script>

<!-- =======================================================
     VIDEO SCRIPT
======================================================== -->

<script
  type="module"
  src="./js/videos.js"
></script>

</body>
</html>
