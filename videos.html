<!DOCTYPE html>

<html lang="en">

<head>

  <title>Video Academy | GTRADES-AXIS™</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #05070b;
      color: #fff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    header {
      background: #080b11;
      border-bottom: 1px solid #1d2938;
      padding: 22px 5%;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand span {
      color: #2196f3;
    }

    .subtitle {
      color: #8d9aae;
      margin-top: 5px;
      font-size: 14px;
    }

    main {
      width: min(1200px, 94%);
      margin: auto;
      padding: 30px 0 60px;
    }

    .hero h1 {
      margin: 0;
      font-size: 32px;
    }

    .hero p {
      color: #94a3b8;
      margin-top: 10px;
      line-height: 1.6;
    }

    /* ======================================================
       FILTERS
    ====================================================== */

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0;
    }

    .filter-btn {
      border: 1px solid #263244;
      background: #0b1018;
      color: #b8c3d1;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #2196f3;
      border-color: #2196f3;
      color: white;
    }

    /* ======================================================
       PLAYER
    ====================================================== */

    .player-panel {
      background: #090d14;
      border: 1px solid #1d2938;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 35px;
    }

    .player-header {
      padding: 18px 20px;
      border-bottom: 1px solid #1d2938;
    }

    .player-label {
      color: #2196f3;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #nowPlayingTitle {
      margin-top: 7px;
      font-size: 20px;
      font-weight: 700;
    }

    .player-wrapper {
      background: #000;
      width: 100%;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #r2VideoPlayer {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      min-height: 320px;
      background: #000;
    }

    #playerMessage {
      display: none;
      color: #94a3b8;
      padding: 70px 20px;
      text-align: center;
      line-height: 1.6;
    }

    #playerMessage.show {
      display: block;
    }

    /* ======================================================
       VIDEO GRID
    ====================================================== */

    .section-title {
      font-size: 22px;
      margin-bottom: 18px;
    }

    #videosContainer {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(250px, 1fr)
        );
      gap: 20px;
    }

    .video-card {
      background: #0b1018;
      border: 1px solid #1d2938;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: #2196f3;
    }

    .video-card.locked {
      opacity: 0.85;
    }

    .video-thumb {
      height: 150px;
      background:
        linear-gradient(
          135deg,
          #101722,
          #070a10
        );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .play-icon {
      font-size: 46px;
      color: #2196f3;
    }

    .lock-icon {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      color: #f5c451;
      font-size: 14px;
    }

    .video-info {
      padding: 16px;
    }

    .video-title {
      font-weight: 700;
      line-height: 1.4;
      min-height: 40px;
    }

    .video-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: #8d9aae;
      font-size: 13px;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
      white-space: nowrap;
    }

    .badge-free {
      background: #123b27;
      color: #55e89a;
    }

    .badge-premium {
      background: #392b08;
      color: #f5c451;
    }

    .status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #94a3b8;
    }

    #noResultsMessage {
      display: none;
      text-align: center;
      color: #94a3b8;
      padding: 50px;
    }

    /* ======================================================
       MOBILE
    ====================================================== */

    @media (max-width: 600px) {

      .hero h1 {
        font-size: 26px;
      }

      .player-wrapper {
        min-height: 220px;
      }

      #r2VideoPlayer {
        min-height: 220px;
      }

      #videosContainer {
        grid-template-columns: 1fr;
      }

      .filters {
        gap: 7px;
      }

      .filter-btn {
        padding: 9px 12px;
        font-size: 13px;
      }

    }

  </style>

</head>

  <script type="module">

    // ========================================================
    // FIREBASE IMPORTS
    // ========================================================

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy
    }
    from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";


    // ========================================================
    // FIREBASE CONFIG
    // ========================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyBZmsLm64PyEL9jifi32bpgvWfhluIWCZM",

      authDomain:
        "gtrades-axis.firebaseapp.com",

      projectId:
        "gtrades-axis",

      storageBucket:
        "gtrades-axis.firebasestorage.app",

      messagingSenderId:
        "111456545888",

      appId:
        "1:111456545888:web:f0526c142d7ea5e22fe705"

    };


    // ========================================================
    // INITIALIZE FIREBASE
    // ========================================================

    const firebaseApp =
      initializeApp(
        firebaseConfig
      );


    const auth =
      getAuth(
        firebaseApp
      );


    const db =
      getFirestore(
        firebaseApp
      );


    // ========================================================
    // CLOUDFLARE R2 WORKER
    // ========================================================

    const R2_WORKER =
      "https://r2-uploader.davidthuku574.workers.dev";


    // ========================================================
    // DOM ELEMENTS
    // ========================================================

    const player =
      document.getElementById(
        "r2VideoPlayer"
      );


    const playerMessage =
      document.getElementById(
        "playerMessage"
      );


    const nowPlayingTitle =
      document.getElementById(
        "nowPlayingTitle"
      );


    const videosContainer =
      document.getElementById(
        "videosContainer"
      );


    const noResults =
      document.getElementById(
        "noResultsMessage"
      );


    const filterButtons =
      document.querySelectorAll(
        ".filter-btn"
      );


    // ========================================================
    // STATE
    // ========================================================

    let videos = [];

    let activeCategory =
      "All";

    let currentUser =
      null;


    // ========================================================
    // GET VIDEO KEY
    // ========================================================

    function getVideoKey(video) {

      return (

        video.videoKey ||

        video.fileKey ||

        video.r2Key ||

        video.storageKey ||

        video.resourceKey ||

        ""

      );

    }


    // ========================================================
    // BUILD R2 URL
    //
    // IMPORTANT:
    // The Worker uses:
    //
    // /file?key=...
    //
    // ========================================================

    function buildR2URL(videoKey) {

      if (!videoKey) {

        throw new Error(
          "This video does not have a videoKey."
        );

      }


      const url =
        `${R2_WORKER}/file?key=` +
        encodeURIComponent(
          videoKey
        );


      console.log(
        "GTRADES-AXIS™ R2 VIDEO URL:",
        url
      );


      return url;

    }


    // ========================================================
    // LOAD VIDEOS
    // ========================================================

    async function loadVideos() {

      console.log(
        "===================================="
      );

      console.log(
        "GTRADES-AXIS™ VIDEO LIBRARY"
      );

      console.log(
        "Loading videos from Firestore..."
      );

      console.log(
        "===================================="
      );


      videosContainer.innerHTML = `

        <div class="status">
          Loading videos...
        </div>

      `;


      try {

        let snapshot;


        // ====================================================
        // ORDERED QUERY
        // ====================================================

        try {

          const videosQuery =
            query(
              collection(
                db,
                "videos"
              ),

              orderBy(
                "createdAt",
                "desc"
              )
            );


          snapshot =
            await getDocs(
              videosQuery
            );


        } catch (orderError) {

          console.warn(
            "createdAt ordering failed. Loading normally.",
            orderError
          );


          snapshot =
            await getDocs(
              collection(
                db,
                "videos"
              )
            );

        }


        // ====================================================
        // BUILD VIDEO ARRAY
        // ====================================================

        videos = [];


        snapshot.forEach(
          docSnap => {

            const data =
              docSnap.data();


            const video = {

              id:
                docSnap.id,

              ...data

            };


            console.log(
              "VIDEO DOCUMENT:",
              video
            );


            videos.push(
              video
            );

          }
        );


        // ====================================================
        // LOCAL SORT
        // ====================================================

        videos.sort(
          (a, b) => {

            const aTime =
              a.createdAt?.seconds ||
              a.updatedAt?.seconds ||
              0;


            const bTime =
              b.createdAt?.seconds ||
              b.updatedAt?.seconds ||
              0;


            return (
              bTime -
              aTime
            );

          }
        );


        // ====================================================
        // DEBUG VIDEO KEYS
        // ====================================================

        videos.forEach(
          video => {

            console.log(
              "VIDEO:",
              video.title
            );

            console.log(
              "VIDEO KEY:",
              getVideoKey(video)
            );

            console.log(
              "PREMIUM:",
              video.premiumOnly
            );

          }
        );


        console.log(
          "TOTAL VIDEOS:",
          videos.length
        );


        // ====================================================
        // RENDER
        // ====================================================

        renderVideos();


        // ====================================================
        // FIRST VIDEO
        // ====================================================

        if (
          videos.length > 0
        ) {

          openVideo(
            videos[0]
          );

        } else {

          videosContainer.innerHTML = `

            <div class="status">
              No videos available yet.
            </div>

          `;

        }


      } catch (error) {

        console.error(
          "FIRESTORE VIDEO ERROR:",
          error
        );


        videosContainer.innerHTML = `

          <div class="status">
            Unable to load videos.
          </div>

        `;

      }

    }


    // ========================================================
    // RENDER VIDEOS
    // ========================================================

    function renderVideos() {

      videosContainer.innerHTML =
        "";


      noResults.style.display =
        "none";


      let filtered =
        [...videos];


      // ======================================================
      // CATEGORY FILTER
      // ======================================================

      if (
        activeCategory !==
        "All"
      ) {

        filtered =
          filtered.filter(
            video => {

              const category =
                String(
                  video.category ||
                  "General"
                )
                .toLowerCase()
                .trim();


              return (
                category ===
                activeCategory
                  .toLowerCase()
                  .trim()
              );

            }
          );

      }


      // ======================================================
      // NO RESULTS
      // ======================================================

      if (
        filtered.length === 0
      ) {

        noResults.style.display =
          "block";

        return;

      }


      // ======================================================
      // CREATE CARDS
      // ======================================================

      filtered.forEach(
        video => {

          videosContainer.appendChild(
            createVideoCard(
              video
            )
          );

        }
      );

    }


    // ========================================================
    // CREATE VIDEO CARD
    // ========================================================

    function createVideoCard(
      video
    ) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "video-card";


      const title =
        video.title ||
        "Untitled Video";


      const category =
        video.category ||
        "General";


      const premium =
        video.premiumOnly === true;


      const videoKey =
        getVideoKey(
          video
        );


      card.innerHTML = `

        <div class="video-thumb">

          <div class="play-icon">
            ▶
          </div>

          ${
            premium
              ? `
                <div class="lock-icon">
                  🔒
                </div>
              `
              : ""
          }

        </div>


        <div class="video-info">

          <div class="video-title">
            ${escapeHTML(title)}
          </div>


          <div class="video-meta">

            <span>
              ${escapeHTML(category)}
            </span>


            <span
              class="badge ${
                premium
                  ? "badge-premium"
                  : "badge-free"
              }"
            >

              ${
                premium
                  ? "Premium"
                  : "Free"
              }

            </span>

          </div>

        </div>

      `;


      if (
        premium
      ) {

        card.classList.add(
          "locked"
        );

      }


      // ======================================================
      // CLICK
      // ======================================================

      card.addEventListener(
        "click",
        () => {

          openVideo(
            video
          );

        }
      );


      return card;

    }


    // ========================================================
    // OPEN VIDEO
    // ========================================================

    function openVideo(
      video
    ) {

      console.log(
        "===================================="
      );

      console.log(
        "OPEN VIDEO:",
        video.title
      );

      console.log(
        "VIDEO DOCUMENT:",
        video
      );


      // ======================================================
      // GET KEY
      // ======================================================

      const videoKey =
        getVideoKey(
          video
        );


      if (!videoKey) {

        console.error(
          "MISSING VIDEO KEY:",
          video
        );


        showPlayerError(
          "This video has no R2 file attached."
        );


        return;

      }


      // ======================================================
      // PREMIUM
      //
      // We don't block premium videos here based only
      // on Firebase Auth because your existing site can
      // have membership logic handled elsewhere.
      //
      // The important part is that the video key exists
      // and R2 serves the file.
      // ======================================================

      const premiumOnly =
        video.premiumOnly === true;


      if (
        premiumOnly &&
        !currentUser
      ) {

        showPlayerError(
          "Please log in to watch this premium video."
        );


        return;

      }


      // ======================================================
      // BUILD R2 URL
      // ======================================================

      let videoURL;


      try {

        videoURL =
          buildR2URL(
            videoKey
          );

      } catch (error) {

        console.error(
          "R2 URL ERROR:",
          error
        );


        showPlayerError(
          error.message
        );


        return;

      }


      // ======================================================
      // TITLE
      // ======================================================

      nowPlayingTitle.textContent =
        video.title ||
        "GTRADES-AXIS™ Video";


      // ======================================================
      // HIDE MESSAGE
      // ======================================================

      playerMessage.classList.remove(
        "show"
      );


      // ======================================================
      // STOP CURRENT VIDEO
      // ======================================================

      player.pause();


      player.removeAttribute(
        "src"
      );


      player.load();


      // ======================================================
      // SET R2 VIDEO
      // ======================================================

      player.src =
        videoURL;


      // ======================================================
      // LOAD
      // ======================================================

      player.load();


      // ======================================================
      // SCROLL TO PLAYER
      // ======================================================

      const playerPanel =
        document.querySelector(
          ".player-panel"
        );


      if (
        playerPanel
      ) {

        playerPanel.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }


      // ======================================================
      // PLAY
      // ======================================================

      player.play()
        .then(
          () => {

            console.log(
              "Video playback started."
            );

          }
        )
        .catch(
          error => {

            console.log(
              "Autoplay blocked. Press Play.",
              error
            );

          }
        );


      // ======================================================
      // VIDEO ERROR LISTENER
      // ======================================================

      player.onerror =
        () => {

          console.error(
            "VIDEO PLAYER ERROR:",
            player.error
          );


          showPlayerError(
            "Unable to play this video. Check the R2 file and Worker."
          );

        };

    }


    // ========================================================
    // PLAYER ERROR
    // ========================================================

    function showPlayerError(
      message
    ) {

      player.pause();


      player.removeAttribute(
        "src"
      );


      player.load();


      playerMessage.textContent =
        message;


      playerMessage.classList.add(
        "show"
      );

    }


    // ========================================================
    // HTML ESCAPE
    // ========================================================

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    // ========================================================
    // FILTER BUTTONS
    // ========================================================

    filterButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            filterButtons.forEach(
              btn => {

                btn.classList.remove(
                  "active"
                );

              }
            );


            button.classList.add(
              "active"
            );


            activeCategory =
              button.dataset.category ||
              "All";


            renderVideos();

          }
        );

      }
    );


    // ========================================================
    // AUTHENTICATION
    // ========================================================

    onAuthStateChanged(
      auth,
      user => {

        console.log(
          "AUTH STATE:",
          user
        );


        currentUser =
          user;


        // ====================================================
        // NOT LOGGED IN
        // ====================================================

        if (!user) {

          window.location.href =
            "/login.html";

          return;

        }


        // ====================================================
        // LOAD VIDEOS
        // ====================================================

        loadVideos();

      }
    );


    // ========================================================
    // INITIAL PLAYER ERROR HANDLER
    // ========================================================

    player.addEventListener(
      "error",
      () => {

        if (
          player.error
        ) {

          console.error(
            "HTML VIDEO ERROR:",
            player.error
          );

        }

      }
    );


    // ========================================================
    // READY
    // ========================================================

    console.log(
      "✅ GTRADES-AXIS™ Video Academy loaded."
    );

    console.log(
      "☁️ Cloudflare R2 Worker:",
      R2_WORKER
    );

  </script>
