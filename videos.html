<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Academy | GTRADES-AXIS™</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #05070b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: #080b11;
      border-bottom: 1px solid #1d2938;
      padding: 22px 5%;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand span {
      color: #2196f3;
    }

    .subtitle {
      color: #8d9aae;
      margin-top: 5px;
      font-size: 14px;
    }

    main {
      width: min(1200px, 94%);
      margin: auto;
      padding: 30px 0 60px;
    }

    .hero h1 {
      margin: 0;
      font-size: 32px;
    }

    .hero p {
      color: #94a3b8;
      margin-top: 10px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0;
    }

    .filter-btn {
      border: 1px solid #263244;
      background: #0b1018;
      color: #b8c3d1;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #2196f3;
      border-color: #2196f3;
      color: #fff;
    }

    .player-panel {
      background: #090d14;
      border: 1px solid #1d2938;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 35px;
    }

    .player-header {
      padding: 18px 20px;
      border-bottom: 1px solid #1d2938;
    }

    .player-label {
      color: #2196f3;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #nowPlayingTitle {
      margin-top: 7px;
      font-size: 20px;
      font-weight: 700;
    }

    .player-wrapper {
      background: #000;
      width: 100%;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #r2VideoPlayer {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      background: #000;
    }

    #playerMessage {
      display: none;
      color: #94a3b8;
      padding: 70px 20px;
      text-align: center;
      position: absolute;
    }

    #playerMessage.show {
      display: block;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 18px;
    }

    #videosContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #0b1018;
      border: 1px solid #1d2938;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: #2196f3;
    }

    .video-thumb {
      height: 150px;
      background: #101722;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
    }

    .play-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #2196f3;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      padding-left: 4px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .video-info {
      padding: 16px;
    }

    .video-title {
      font-weight: 700;
      line-height: 1.4;
    }

    .video-description {
      color: #8d9aae;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 8px;
    }

    .video-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      color: #8d9aae;
      font-size: 13px;
      align-items: center;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-free {
      background: #123b27;
      color: #55e89a;
    }

    .badge-premium {
      background: #392b08;
      color: #f5c451;
    }

    .status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #94a3b8;
    }

    #noResultsMessage {
      display: none;
      text-align: center;
      color: #94a3b8;
      padding: 50px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 26px;
      }

      .player-wrapper {
        min-height: 220px;
      }

      #videosContainer {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<body>

<header>
  <div class="brand">
    GTRADES-<span>AXIS™</span>
  </div>

  <div class="subtitle">
    Trading Academy
  </div>
</header>

<main>

  <section class="hero">
    <h1>Private Video Library</h1>

<p>
  Watch your GTRADES-AXIS™ trading lessons,
  market analysis and academy training.
</p>

  </section>

  <div class="filters">


<button
  class="filter-btn active"
  data-category="All"
  type="button"
>
  All
</button>

<button
  class="filter-btn"
  data-category="Market Structure"
  type="button"
>
  Market Structure
</button>

<button
  class="filter-btn"
  data-category="Supply & Demand"
  type="button"
>
  Supply & Demand
</button>

<button
  class="filter-btn"
  data-category="Entries"
  type="button"
>
  Entries
</button>

<button
  class="filter-btn"
  data-category="Risk Management"
  type="button"
>
  Risk Management
</button>

<button
  class="filter-btn"
  data-category="Psychology"
  type="button"
>
  Psychology
</button>


  </div>

  <section class="player-panel">


<div class="player-header">

  <div class="player-label">
    Now Playing
  </div>

  <div id="nowPlayingTitle">
    Select a video
  </div>

</div>

<div class="player-wrapper">

  <video
    id="r2VideoPlayer"
    controls
    playsinline
    preload="metadata"
  ></video>

  <div id="playerMessage">
    Select a video to begin watching.
  </div>

</div>


  </section>

  <h2 class="section-title">
    Video Lessons
  </h2>

  <div id="videosContainer">

<div class="status">
  Loading videos...
</div>


  </div>

  <div id="noResultsMessage">
    No videos found.
  </div>

</main>

<script type="module">

/* ============================================================
   FIREBASE
============================================================ */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";


/* ============================================================
   FIREBASE CONFIG
============================================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyBZmsLm64PyEL9jifi32bpgvWfhluIWCZM",

  authDomain:
    "gtrades-axis.firebaseapp.com",

  projectId:
    "gtrades-axis",

  storageBucket:
    "gtrades-axis.firebasestorage.app",

  messagingSenderId:
    "111456545888",

  appId:
    "1:111456545888:web:f0526c142d7ea5e22fe705"

};


/* ============================================================
   INITIALIZE FIREBASE
============================================================ */

const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);


/* ============================================================
   CLOUDFLARE R2
============================================================ */

const R2_WORKER =
  "https://r2-uploader.davidthuku574.workers.dev";


/* ============================================================
   ELEMENTS
============================================================ */

const player =
  document.getElementById(
    "r2VideoPlayer"
  );

const playerMessage =
  document.getElementById(
    "playerMessage"
  );

const nowPlayingTitle =
  document.getElementById(
    "nowPlayingTitle"
  );

const videosContainer =
  document.getElementById(
    "videosContainer"
  );

const noResults =
  document.getElementById(
    "noResultsMessage"
  );

const filterButtons =
  document.querySelectorAll(
    ".filter-btn"
  );


/* ============================================================
   STATE
============================================================ */

let videos = [];

let activeCategory =
  "All";

let currentVideoKey =
  "";


/* ============================================================
   GET VIDEO KEY
============================================================ */

function getVideoKey(video) {

  return (
    video.videoKey ||
    video.fileKey ||
    video.r2Key ||
    video.storageKey ||
    video.resourceKey ||
    video.key ||
    ""
  );

}


/* ============================================================
   BUILD R2 VIDEO URL
============================================================ */

function buildR2URL(videoKey) {

  if (!videoKey) {

    throw new Error(
      "This video does not have an R2 file key."
    );

  }

  return (
    `${R2_WORKER}/file?key=` +
    encodeURIComponent(videoKey)
  );

}


/* ============================================================
   LOAD VIDEOS
============================================================ */

async function loadVideos() {

  console.log(
    "GTRADES-AXIS™: Loading videos..."
  );

  videosContainer.innerHTML = `
    <div class="status">
      Loading videos...
    </div>
  `;

  try {

    let snapshot;

    /* --------------------------------------------------------
       TRY CREATED DATE ORDER
    -------------------------------------------------------- */

    try {

      const videosQuery =
        query(
          collection(
            db,
            "videos"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        );

      snapshot =
        await getDocs(
          videosQuery
        );

    } catch (orderError) {

      console.warn(
        "createdAt ordering failed. Loading normally.",
        orderError
      );

      snapshot =
        await getDocs(
          collection(
            db,
            "videos"
          )
        );

    }


    /* --------------------------------------------------------
       BUILD ARRAY
    -------------------------------------------------------- */

    videos = [];

    snapshot.forEach(
      videoDoc => {

        const data =
          videoDoc.data();

        const video =
          {
            id:
              videoDoc.id,

            ...data
          };

        console.log(
          "VIDEO DOCUMENT:",
          video
        );

        videos.push(
          video
        );

      }
    );


    /* --------------------------------------------------------
       LOCAL SORT
    -------------------------------------------------------- */

    videos.sort(
      (a, b) => {

        const aTime =
          getTimestamp(
            a.createdAt
          );

        const bTime =
          getTimestamp(
            b.createdAt
          );

        return bTime - aTime;

      }
    );


    console.log(
      "TOTAL VIDEOS:",
      videos.length
    );


    /* --------------------------------------------------------
       RENDER
    -------------------------------------------------------- */

    renderVideos();


    /* --------------------------------------------------------
       OPEN FIRST VIDEO
    -------------------------------------------------------- */

    if (
      videos.length > 0
    ) {

      const firstVideo =
        videos[0];

      console.log(
        "FIRST VIDEO:",
        firstVideo
      );

      openVideo(
        firstVideo,
        false
      );

    } else {

      videosContainer.innerHTML = `
        <div class="status">
          No videos available yet.
        </div>
      `;

    }

  } catch (error) {

    console.error(
      "FIRESTORE VIDEO ERROR:",
      error
    );

    videosContainer.innerHTML = `
      <div class="status">
        Unable to load videos.
      </div>
    `;

  }

}


/* ============================================================
   TIMESTAMP HELPER
============================================================ */

function getTimestamp(value) {

  if (!value) {
    return 0;
  }

  if (
    typeof value.seconds ===
    "number"
  ) {

    return value.seconds;

  }

  if (
    typeof value.toMillis ===
    "function"
  ) {

    return value.toMillis();

  }

  if (
    typeof value ===
    "string"
  ) {

    const parsed =
      Date.parse(value);

    return Number.isNaN(
      parsed
    )
      ? 0
      : parsed;

  }

  return 0;

}


/* ============================================================
   RENDER VIDEOS
============================================================ */

function renderVideos() {

  videosContainer.innerHTML =
    "";

  noResults.style.display =
    "none";


  let filtered =
    [...videos];


  /* ----------------------------------------------------------
     CATEGORY
  ---------------------------------------------------------- */

  if (
    activeCategory !==
    "All"
  ) {

    filtered =
      filtered.filter(
        video => {

          const category =
            String(
              video.category ||
              "General"
            )
              .toLowerCase()
              .trim();

          return (
            category ===
            activeCategory
              .toLowerCase()
              .trim()
          );

        }
      );

  }


  /* ----------------------------------------------------------
     EMPTY
  ---------------------------------------------------------- */

  if (
    filtered.length ===
    0
  ) {

    noResults.style.display =
      "block";

    return;

  }


  /* ----------------------------------------------------------
     CARDS
  ---------------------------------------------------------- */

  filtered.forEach(
    video => {

      videosContainer.appendChild(
        createVideoCard(
          video
        )
      );

    }
  );

}


/* ============================================================
   CREATE VIDEO CARD
============================================================ */

function createVideoCard(
  video
) {

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "video-card";


  const title =
    video.title ||
    "Untitled Video";


  const category =
    video.category ||
    "General";


  const premium =
    video.premiumOnly === true ||
    video.access === "premium" ||
    video.status === "premium";


  const thumbnailKey =
    video.thumbnailKey ||
    video.thumbnail ||
    "";


  let thumbnailHTML =
    "";


  if (thumbnailKey) {

    try {

      const thumbnailURL =
        buildR2URL(
          thumbnailKey
        );

      thumbnailHTML = `
        <img
          src="${thumbnailURL}"
          alt="${escapeHTML(title)}"
          loading="lazy"
          onerror="this.style.display='none';"
        >
      `;

    } catch (error) {

      console.warn(
        "Thumbnail error:",
        error
      );

    }

  }


  card.innerHTML = `

    <div class="video-thumb">

      ${thumbnailHTML}

      <div class="play-overlay">

        <div class="play-icon">
          ▶
        </div>

      </div>

    </div>

    <div class="video-info">

      <div class="video-title">
        ${escapeHTML(title)}
      </div>

      ${
        video.description
          ? `
            <div class="video-description">
              ${escapeHTML(
                video.description
              )}
            </div>
          `
          : ""
      }

      <div class="video-meta">

        <span>
          ${escapeHTML(category)}
        </span>

        <span
          class="badge ${
            premium
              ? "badge-premium"
              : "badge-free"
          }"
        >
          ${
            premium
              ? "Premium"
              : "Free"
          }
        </span>

      </div>

    </div>

  `;


  card.addEventListener(
    "click",
    () => {

      openVideo(
        video,
        true
      );

    }
  );


  return card;

}


/* ============================================================
   OPEN VIDEO
============================================================ */

function openVideo(
  video,
  scrollToPlayer = true
) {

  console.log(
    "GTRADES-AXIS™ OPEN VIDEO:",
    video
  );


  const videoKey =
    getVideoKey(
      video
    );


  if (!videoKey) {

    console.error(
      "MISSING VIDEO KEY:",
      video
    );

    showPlayerError(
      "This video has no R2 file attached."
    );

    return;

  }


  let videoURL;


  try {

    videoURL =
      buildR2URL(
        videoKey
      );

  } catch (error) {

    showPlayerError(
      error.message
    );

    return;

  }


  console.log(
    "R2 VIDEO KEY:",
    videoKey
  );

  console.log(
    "R2 VIDEO URL:",
    videoURL
  );


  currentVideoKey =
    videoKey;


  nowPlayingTitle.textContent =
    video.title ||
    "GTRADES-AXIS™ Video";


  playerMessage.classList.remove(
    "show"
  );


  /* ----------------------------------------------------------
     STOP PREVIOUS VIDEO
  ---------------------------------------------------------- */

  player.pause();

  player.removeAttribute(
    "src"
  );

  player.load();


  /* ----------------------------------------------------------
     LOAD NEW VIDEO
  ---------------------------------------------------------- */

  player.src =
    videoURL;

  player.load();


  /* ----------------------------------------------------------
     ERROR HANDLING
  ---------------------------------------------------------- */

  player.onerror =
    () => {

      console.error(
        "VIDEO PLAYER ERROR:",
        player.error
      );

      showPlayerError(
        "Unable to play this video. Please try again."
      );

    };


  /* ----------------------------------------------------------
     SCROLL
  ---------------------------------------------------------- */

  if (
    scrollToPlayer
  ) {

    document
      .querySelector(
        ".player-panel"
      )
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

  }


  /* ----------------------------------------------------------
     AUTOPLAY
  ---------------------------------------------------------- */

  player.play()
    .catch(
      error => {

        console.log(
          "Autoplay blocked. Press Play.",
          error
        );

      }
    );

}


/* ============================================================
   PLAYER ERROR
============================================================ */

function showPlayerError(
  message
) {

  player.pause();

  player.removeAttribute(
    "src"
  );

  player.load();


  playerMessage.textContent =
    message;


  playerMessage.classList.add(
    "show"
  );

}


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ============================================================
   FILTER BUTTONS
============================================================ */

filterButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        filterButtons.forEach(
          btn => {

            btn.classList.remove(
              "active"
            );

          }
        );


        button.classList.add(
          "active"
        );


        activeCategory =
          button.dataset.category ||
          "All";


        renderVideos();

      }
    );

  }
);


/* ============================================================
   AUTHENTICATION
============================================================ */

onAuthStateChanged(
  auth,
  user => {

    console.log(
      "GTRADES-AXIS™ AUTH STATE:",
      user
    );


    if (!user) {

      window.location.href =
        "/login";

      return;

    }


    loadVideos();

  }
);


/* ============================================================
   DEBUG
============================================================ */

console.log(
  "✅ GTRADES-AXIS™ Video Academy loaded"
);

console.log(
  "☁️ Cloudflare R2 Worker:",
  R2_WORKER
);

</script>

</body>
</html>
