<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Video Academy | GTRADES-AXIS™</title>

  <meta
    name="description"
    content="GTRADES-AXIS™ Private Video Library"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #05070b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
    }

    header {
      padding: 24px;
      border-bottom: 1px solid #1c2533;
      background: #080b11;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand span {
      color: #2196f3;
    }

    .subtitle {
      margin-top: 6px;
      color: #8d9aae;
      font-size: 14px;
    }

    main {
      width: min(1200px, 94%);
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    .hero {
      margin-bottom: 25px;
    }

    .hero h1 {
      margin: 0;
      font-size: 32px;
    }

    .hero p {
      color: #94a3b8;
      margin-top: 10px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filter-btn {
      border: 1px solid #263244;
      background: #0b1018;
      color: #b8c3d1;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #2196f3;
      color: #ffffff;
      border-color: #2196f3;
    }

    /* ==============================
       VIDEO PLAYER
    ============================== */

    .player-panel {
      background: #0a0f17;
      border: 1px solid #1d2938;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 35px;
    }

    .player-header {
      padding: 18px 20px;
      border-bottom: 1px solid #1d2938;
    }

    .player-label {
      font-size: 12px;
      color: #2196f3;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    #nowPlayingTitle {
      margin-top: 7px;
      font-size: 20px;
      font-weight: 700;
    }

    .player-wrapper {
      width: 100%;
      background: #000;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #r2VideoPlayer {
      display: block;
      width: 100%;
      max-height: 72vh;
      background: #000;
    }

    #playerMessage {
      display: none;
      padding: 70px 20px;
      text-align: center;
      color: #94a3b8;
    }

    #playerMessage.show {
      display: block;
    }

    /* ==============================
       VIDEO GRID
    ============================== */

    .section-title {
      margin-bottom: 18px;
      font-size: 22px;
    }

    #videosContainer {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #0b1018;
      border: 1px solid #1d2938;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: .2s ease;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: #2196f3;
    }

    .video-thumb {
      height: 150px;
      background: #101722;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-icon {
      font-size: 45px;
      color: #2196f3;
    }

    .video-info {
      padding: 16px;
    }

    .video-title {
      font-weight: 700;
      line-height: 1.4;
    }

    .video-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: #8d9aae;
      font-size: 13px;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
    }

    .badge-free {
      background: #123b27;
      color: #55e89a;
    }

    .badge-premium {
      background: #392b08;
      color: #f5c451;
    }

    #noResultsMessage {
      display: none;
      text-align: center;
      padding: 50px;
      color: #94a3b8;
    }

    .status {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 25px;
      }

      .player-wrapper {
        min-height: 220px;
      }

      #videosContainer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header>
    <div class="brand">
      GTRADES-<span>AXIS™</span>
    </div>

    <div class="subtitle">
      Trading Academy
    </div>
  </header>

  <main>

    <section class="hero">

      <h1>
        Private Video Library
      </h1>

      <p>
        Watch your GTRADES-AXIS™ trading lessons,
        market analysis and academy training.
      </p>

    </section>

    <div class="filters">

      <button
        class="filter-btn active"
        data-category="All"
      >
        All
      </button>

      <button
        class="filter-btn"
        data-category="Market Structure"
      >
        Market Structure
      </button>

      <button
        class="filter-btn"
        data-category="Supply & Demand"
      >
        Supply & Demand
      </button>

      <button
        class="filter-btn"
        data-category="Entries"
      >
        Entries
      </button>

      <button
        class="filter-btn"
        data-category="Risk Management"
      >
        Risk Management
      </button>

      <button
        class="filter-btn"
        data-category="Psychology"
      >
        Psychology
      </button>

    </div>

    <!-- ==========================================
         PLAYER IS AVAILABLE IMMEDIATELY
    =========================================== -->

    <section class="player-panel">

      <div class="player-header">

        <div class="player-label">
          Now Playing
        </div>

        <div id="nowPlayingTitle">
          Select a video below
        </div>

      </div>

      <div class="player-wrapper">

        <video
          id="r2VideoPlayer"
          controls
          playsinline
          preload="metadata"
        ></video>

        <div id="playerMessage">
          Loading video...
        </div>

      </div>

    </section>

    <section>

      <h2 class="section-title">
        Video Lessons
      </h2>

      <div
        id="videosContainer"
        class="status"
      >
        Loading videos...
      </div>

      <div id="noResultsMessage">
        No videos found.
      </div>

    </section>

  </main>

</div>

<script type="module">

  import {
    auth,
    db
  } from "./firebase.js";

  import {
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

  import {
    collection,
    getDocs,
    query,
    orderBy
  } from
  "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";


  /* =========================================
     R2 WORKER
  ========================================= */

  const R2_WORKER =
    "https://r2-uploader.davidthuku574.workers.dev";


  /* =========================================
     ELEMENTS
  ========================================= */

  const container =
    document.getElementById(
      "videosContainer"
    );

  const player =
    document.getElementById(
      "r2VideoPlayer"
    );

  const playerMessage =
    document.getElementById(
      "playerMessage"
    );

  const nowPlayingTitle =
    document.getElementById(
      "nowPlayingTitle"
    );

  const noResults =
    document.getElementById(
      "noResultsMessage"
    );

  const filterButtons =
    document.querySelectorAll(
      ".filter-btn"
    );


  /* =========================================
     STATE
  ========================================= */

  let videos = [];

  let activeCategory = "All";


  /* =========================================
     R2 URL
  ========================================= */

  function getR2URL(key) {

    if (!key) {
      throw new Error(
        "Video has no R2 key."
      );
    }

    const url =
      new URL(R2_WORKER);

    url.searchParams.set(
      "key",
      key
    );

    url.searchParams.set(
      "action",
      "file"
    );

    return url.toString();
  }


  /* =========================================
     LOAD VIDEOS
  ========================================= */

  async function loadVideos() {

    container.className = "status";

    container.innerHTML =
      "Loading videos...";

    try {

      let snapshot;

      try {

        const q =
          query(
            collection(
              db,
              "videos"
            ),
            orderBy(
              "createdAt",
              "desc"
            )
          );

        snapshot =
          await getDocs(q);

      } catch (error) {

        console.warn(
          "Ordered query failed:",
          error
        );

        snapshot =
          await getDocs(
            collection(
              db,
              "videos"
            )
          );
      }


      videos = [];

      snapshot.forEach(
        (docSnap) => {

          const data =
            docSnap.data();

          videos.push({
            id: docSnap.id,
            ...data
          });

        }
      );


      console.log(
        "VIDEOS FOUND:",
        videos
      );


      renderVideos();


      /*
       * Automatically open first video.
       *
       * This is the important part.
       */

      if (
        videos.length > 0
      ) {

        openVideo(
          videos[0]
        );

      }

    } catch (error) {

      console.error(
        "VIDEO LOAD ERROR:",
        error
      );

      container.className =
        "status";

      container.innerHTML =
        "Unable to load videos.";

    }

  }


  /* =========================================
     RENDER
  ========================================= */

  function renderVideos() {

    container.className = "";

    container.innerHTML = "";

    noResults.style.display =
      "none";


    let filtered =
      [...videos];


    if (
      activeCategory !== "All"
    ) {

      filtered =
        filtered.filter(
          video =>
            String(
              video.category || ""
            ).toLowerCase()
            ===
            activeCategory
              .toLowerCase()
        );

    }


    if (
      filtered.length === 0
    ) {

      noResults.style.display =
        "block";

      return;

    }


    filtered.forEach(
      video => {

        const card =
          createVideoCard(
            video
          );

        container.appendChild(
          card
        );

      }
    );

  }


  /* =========================================
     CARD
  ========================================= */

  function createVideoCard(
    video
  ) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "video-card";


    const title =
      video.title ||
      "Untitled Video";


    const category =
      video.category ||
      "General";


    const premium =
      video.premiumOnly === true;


    card.innerHTML = `

      <div class="video-thumb">

        <div class="play-icon">
          ▶
        </div>

      </div>

      <div class="video-info">

        <div class="video-title">
          ${escapeHTML(title)}
        </div>

        <div class="video-meta">

          <span>
            ${escapeHTML(category)}
          </span>

          <span class="badge ${
            premium
              ? "badge-premium"
              : "badge-free"
          }">

            ${
              premium
                ? "Premium"
                : "Free"
            }

          </span>

        </div>

      </div>

    `;


    card.addEventListener(
      "click",
      () => {

        openVideo(
          video
        );

      }
    );


    return card;

  }


  /* =========================================
     OPEN VIDEO
  ========================================= */

  function openVideo(
    video
  ) {

    const key =
      video.videoKey ||
      video.fileKey ||
      video.r2Key ||
      video.storageKey;


    if (!key) {

      console.error(
        "NO VIDEO KEY:",
        video
      );

      showPlayerError(
        "This video has no R2 file attached."
      );

      return;

    }


    const url =
      getR2URL(key);


    console.log(
      "PLAYING R2 VIDEO:",
      url
    );


    nowPlayingTitle.textContent =
      video.title ||
      "GTRADES-AXIS™ Video";


    playerMessage.classList.remove(
      "show"
    );


    /*
     * Clear previous video.
     */

    player.pause();

    player.removeAttribute(
      "src"
    );

    player.load();


    /*
     * Set new R2 video.
     */

    player.src =
      url;

    player.load();


    /*
     * Scroll player into view
     * when a card is clicked.
     */

    document
      .querySelector(
        ".player-panel"
      )
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });


    /*
     * Autoplay may be blocked.
     * That's okay — controls remain visible.
     */

    player.play()
      .catch(
        error => {

          console.log(
            "Autoplay blocked:",
            error
          );

        }
      );

  }


  /* =========================================
     PLAYER ERROR
  ========================================= */

  function showPlayerError(
    message
  ) {

    player.pause();

    player.removeAttribute(
      "src"
    );

    player.load();

    playerMessage.textContent =
      message;

    playerMessage.classList.add(
      "show"
    );

  }


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHTML(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =========================================
     FILTERS
  ========================================= */

  filterButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          filterButtons.forEach(
            btn =>
              btn.classList.remove(
                "active"
              )
          );


          button.classList.add(
            "active"
          );


          activeCategory =
            button.dataset.category ||
            "All";


          renderVideos();

        }
      );

    }
  );


  /* =========================================
     AUTH
  ========================================= */

  onAuthStateChanged(
    auth,
    user => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      /*
       * IMPORTANT:
       *
       * We load the videos immediately
       * after authentication.
       *
       * The player is NOT blocked behind
       * a "Checking membership..." screen.
       */

      loadVideos();

    }
  );

</script>

</body>
</html>
