<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trade Review | GTRADES-AXIS™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="premium-academy.css" />
  <style>
    .review-container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .upload-section { background: rgba(255,255,255,0.04); border: 2px dashed rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 24px; transition: 0.3s; }
    .upload-section.dragover { border-color: #1d9bf0; background: rgba(29,155,240,0.05); }
    .upload-section .icon { font-size: 3rem; color: #1d9bf0; margin-bottom: 12px; }
    .upload-section label { display: inline-block; padding: 8px 20px; background: linear-gradient(135deg, #1d9bf0, #4db6ff); color: #fff; border-radius: 8px; cursor: pointer; font-weight: 500; margin-top: 12px; }
    .upload-section input[type="file"] { display: none; }
    .upload-preview { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
    .upload-preview .preview-item { position: relative; width: 120px; height: 120px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
    .upload-preview .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .upload-preview .preview-item .remove { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); color: #ff4d4f; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }
    .form-section { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .form-section h3 { margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
    .form-group select, .form-group input { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #e2e8f0; font-family: 'Poppins', sans-serif; outline: none; }
    .form-group select:focus, .form-group input:focus { border-color: #1d9bf0; }
    .btn-primary { background: linear-gradient(135deg, #1d9bf0, #4db6ff); color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .result-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; margin-top: 20px; display: none; }
    .result-box .score { font-size: 3rem; font-weight: 700; text-align: center; }
    .result-box .score .label { font-size: 0.9rem; color: #94a3b8; }
    .result-box .score .number { display: block; }
    .result-box .feedback { margin-top: 16px; }
    .result-box .feedback ul { list-style: none; padding: 0; }
    .result-box .feedback li { padding: 8px 12px; margin-bottom: 6px; border-radius: 6px; background: rgba(255,255,255,0.03); border-left: 3px solid #1d9bf0; }
    .result-box .feedback li.pass { border-left-color: #00c853; }
    .result-box .feedback li.fail { border-left-color: #ff4d4f; }
    .photon-badge { display: inline-block; padding: 4px 16px; border-radius: 20px; font-weight: 600; }
    .photon-badge.excellent { background: rgba(0,200,83,0.2); color: #00c853; }
    .photon-badge.good { background: rgba(29,155,240,0.2); color: #1d9bf0; }
    .photon-badge.average { background: rgba(255,179,0,0.2); color: #ffb300; }
    .photon-badge.poor { background: rgba(255,77,79,0.2); color: #ff4d4f; }
  </style>
</head>
<body>

<div class="academy-container">
  <aside class="sidebar">
    <div class="logo"><h2>GTRADES <span>AXIS™</span></h2><p>Premium Academy</p></div>
    <nav>
      <ul>
        <li><i class="fas fa-house"></i> Dashboard</li>
        <li><i class="fas fa-book-open"></i> Modules</li>
        <li><i class="fas fa-folder-open"></i> Resources</li>
        <li class="active"><i class="fas fa-brain"></i> AI Review</li>
        <li><i class="fas fa-award"></i> Certificates</li>
        <li><i class="fas fa-user"></i> Profile</li>
      </ul>
    </nav>
  </aside>

  <div class="content">
    <header class="topbar">
      <div><h1>AI Trade Review</h1><p>Upload your charts and get instant feedback.</p></div>
      <div class="user-box"><img src="images/avatar.png" alt=""><div><h4>Student</h4><p>Premium Member</p></div></div>
    </header>

    <div class="review-container">
      <!-- Upload Section -->
      <div class="upload-section" id="dropZone">
        <div class="icon"><i class="fas fa-cloud-upload-alt"></i></div>
        <p>Drag & drop your HTF, MTF, and Entry screenshots here</p>
        <label for="fileInput">Choose Files</label>
        <input type="file" id="fileInput" accept="image/*" multiple />
        <div class="upload-preview" id="previewContainer"></div>
      </div>

      <!-- Trade Details Form -->
      <div class="form-section">
        <h3>Trade Details</h3>
        <div class="form-group">
          <label>Pair</label>
          <input type="text" id="pair" placeholder="e.g., EURUSD" />
        </div>
        <div class="form-group">
          <label>Direction</label>
          <select id="direction">
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
          </select>
        </div>
        <div class="form-group">
          <label>Entry Model Used</label>
          <select id="entryModel">
            <option value="LC-1">LC-1</option>
            <option value="LC-2A">LC-2A</option>
            <option value="LTF RE">LTF RE</option>
            <option value="MTF RE">MTF RE</option>
          </select>
        </div>
        <div class="form-group">
          <label>Risk-to-Reward (R:R)</label>
          <input type="number" id="rr" placeholder="e.g., 2" step="0.1" />
        </div>
        <div class="form-group">
          <label>Did you follow your trading plan?</label>
          <select id="followedPlan">
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
        <div class="form-group">
          <label>Emotion during trade</label>
          <select id="emotion">
            <option value="calm">Calm</option>
            <option value="confident">Confident</option>
            <option value="fear">Fear</option>
            <option value="greed">Greed</option>
            <option value="fomo">FOMO</option>
            <option value="revenge">Revenge</option>
          </select>
        </div>
        <button class="btn-primary" id="analyzeBtn">Analyze Trade</button>
      </div>

      <!-- Result -->
      <div class="result-box" id="resultBox">
        <div class="score">
          <span class="label">Photon Score</span>
          <span class="number" id="photonScore">0</span>
        </div>
        <div style="text-align:center;margin:8px 0;">
          <span class="photon-badge" id="photonBadge">—</span>
        </div>
        <div class="feedback" id="feedbackList"></div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/ai-review.js"></script>

</body>
</html>
